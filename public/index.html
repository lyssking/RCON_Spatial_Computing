<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL AR VIEWER</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 99999;
            padding: 16px 28px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important; background: transparent !important;">

    <button id="custom-ar-btn">ENTER NOEMATA AR VIEWER</button>

    <script>
        // Disable Frustum Culling Component so matrix transformations don't hide meshes
        AFRAME.registerComponent('no-cull', {
            init: function () {
                this.el.addEventListener('object3dset', () => {
                    this.el.object3D.traverse((obj) => {
                        if (obj.isMesh) {
                            obj.frustumCulled = false;
                            if (obj.geometry) obj.geometry.computeBoundingSphere();
                        }
                    });
                });
            }
        });

        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: anchors, unbounded; referenceSpaceType: local-floor;"
             force-passthrough
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false"
             style="background-color: rgba(0,0,0,0) !important; background: transparent !important;">

        <!-- Ambient Lights -->
        <a-entity light="type: ambient; color: #ffffff; intensity: 2.0;"></a-entity>

        <!-- Camera Rig & Gaze Cursor -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera="near: 0.01; far: 1000;" position="0 1.6 0" look-controls>
                <a-entity id="hud-pointer"
                          raycaster="objects: .gaze-target; far: 10;"
                          cursor="fuse: false;" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                          material="color: #00f0ff; shader: flat; opacity: 0.9; depthTest: false;">
                </a-entity>

                <a-text id="debug-hud" value="SYSTEM ONLINE: SEARCHING FOR NODES..." position="0 0.3 -1.2" align="center" width="1.2" color="#00f0ff" font="monoid"></a-text>
            </a-entity>
        </a-entity>

        <!-- Parent World Anchor with Culling Disabled -->
        <a-entity id="world-mesh" position="0 0 0" no-cull>

            <!-- 1. SMART CLIMATE NODE -->
            <a-entity class="gaze-target" id="smart-climate-asset" position="0 1.4 -1.2" no-cull>
                <a-box width="0.25" height="0.25" depth="0.25" material="color: #00f0ff; shader: flat; wireframe: true;" no-cull></a-box>
                <a-text value="[ CLIMATE NODE ]" position="0 0.25 0" width="1.6" align="center" color="#00f0ff" font="monoid"></a-text>

                <a-entity class="info-card" position="0 0.4 0" visible="false" scale="0.001 0.001 0.001">
                    <a-plane width="0.75" height="0.35" color="#121620" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-climate-status" value="CLIMATE: OPTIMAL" color="#00f0ff" width="1.2" position="-0.3 0.09 0.01" font="monoid"></a-text>
                    <a-text id="popup-climate-temp" value="TEMP: -- °F | HUM: --%" color="#ffffff" width="1.0" position="-0.3 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

            <!-- 2. PERIMETER MONITOR -->
            <a-entity class="gaze-target" id="perimeter-monitor-asset" position="-0.6 1.4 -1.5" no-cull>
                <a-cylinder radius="0.18" height="0.28" material="color: #00f0ff; shader: flat; wireframe: true;" no-cull></a-cylinder>
                <a-text value="[ PERIMETER GUARD ]" position="0 0.28 0" width="1.6" align="center" color="#64748b" font="monoid"></a-text>

                <a-entity class="info-card" position="0 0.4 0" visible="false" scale="0.001 0.001 0.001">
                    <a-plane width="0.7" height="0.32" color="#121620" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-perimeter-status" value="SHIELD: SECURE" color="#00f0ff" width="1.1" position="-0.27 0.08 0.01" font="monoid"></a-text>
                    <a-text id="popup-perimeter-breach" value="BREACHES: 0" color="#ff0055" width="0.9" position="-0.27 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

            <!-- 3. SMART POWER RELAY -->
            <a-entity class="gaze-target" id="smart-relay-asset" position="0.6 1.4 -1.5" no-cull>
                <a-box width="0.2" height="0.2" depth="0.2" material="color: #64748b; shader: flat; wireframe: true;" no-cull></a-box>
                <a-text value="[ POWER RELAY ]" position="0 0.25 0" width="1.6" align="center" color="#64748b" font="monoid"></a-text>

                <a-entity class="info-card" position="0 0.4 0" visible="false" scale="0.001 0.001 0.001">
                    <a-plane width="0.7" height="0.32" color="#121620" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-relay-status" value="RELAY: OFF" color="#ffffff" width="1.1" position="-0.27 0.08 0.01" font="monoid"></a-text>
                    <a-text id="popup-relay-power" value="LOAD: 0.0 kW" color="#64748b" width="0.9" position="-0.27 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        const debugHud = document.getElementById('debug-hud');

        function applyRegisteredAnchors(map) {
            if (!map) return;
            const targets = [
                { key: 'smart_climate_node', elementId: 'smart-climate-asset' },
                { key: 'perimeter_monitor', elementId: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', elementId: 'smart-relay-asset' }
            ];

            let loadedCount = 0;
            targets.forEach(item => {
                const data = map[item.key];
                const el = document.getElementById(item.elementId);
                if (data && el && data.x !== undefined) {
                    const posX = Math.abs(data.x) > 50 ? 0 : parseFloat(data.x);
                    const posY = Math.abs(data.y) > 50 ? 1.4 : parseFloat(data.y);
                    const posZ = Math.abs(data.z) > 50 ? -1.2 : parseFloat(data.z);

                    el.setAttribute('position', `${posX} ${posY} ${posZ}`);

                    // Force Three.js object matrix update
                    if (el.object3D) {
                        el.object3D.position.set(posX, posY, posZ);
                        el.object3D.updateMatrix();
                        el.object3D.updateMatrixWorld(true);
                    }
                    loadedCount++;
                }
            });

            if (debugHud) {
                debugHud.setAttribute('value', `LOCALIZED ${loadedCount}/3 NODES`);
                debugHud.setAttribute('color', '#39ff14');
                setTimeout(() => debugHud.setAttribute('visible', 'false'), 3500);
            }
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => {
                if (db.matrix && db.matrix.position) {
                    const worldMesh = document.getElementById('world-mesh');
                    const mx = Math.abs(db.matrix.position.x) > 50 ? 0 : parseFloat(db.matrix.position.x);
                    const my = Math.abs(db.matrix.position.y) > 50 ? 0 : parseFloat(db.matrix.position.y);
                    const mz = Math.abs(db.matrix.position.z) > 50 ? 0 : parseFloat(db.matrix.position.z);

                    worldMesh.object3D.position.set(mx, my, mz);
                    if (db.matrix.quaternion) {
                        worldMesh.object3D.quaternion.copy(db.matrix.quaternion);
                    }
                    worldMesh.object3D.updateMatrixWorld(true);
                }

                const anchorMap = db.anchors || db;
                applyRegisteredAnchors(anchorMap);
            })
            .catch(err => {
                console.error("Map Fetch Error:", err);
                if (debugHud) debugHud.setAttribute('value', 'DB FETCH FAILED');
            });

        socket.on('spatialAnchorsUpdated', (anchors) => applyRegisteredAnchors(anchors));

        // Hover gaze interaction
        document.querySelectorAll('.gaze-target').forEach(el => {
            const card = el.querySelector('.info-card');
            el.addEventListener('raycaster-intersected', () => {
                if (card) {
                    card.setAttribute('visible', 'true');
                    card.setAttribute('scale', '1 1 1');
                }
            });
            el.addEventListener('raycaster-intersected-cleared', () => {
                if (card) {
                    card.setAttribute('visible', 'false');
                    card.setAttribute('scale', '0.001 0.001 0.001');
                }
            });
        });

        // Telemetry handlers
        socket.on('climateStateUpdate', (data) => {
            const tempText = document.getElementById('popup-climate-temp');
            const statusText = document.getElementById('popup-climate-status');

            if (tempText && statusText) {
                tempText.setAttribute('value', `TEMP: ${data.temperature} °F | HUM: ${data.humidity}%`);
                statusText.setAttribute('value', `CLIMATE: ${data.status}`);
            }
        });

        socket.on('twinStateUpdate', (state) => {
            if (state.perimeter_monitor) {
                const pStatus = document.getElementById('popup-perimeter-status');
                const pBreach = document.getElementById('popup-perimeter-breach');

                if (pStatus) pStatus.setAttribute('value', `SHIELD: ${state.perimeter_monitor.perimeter}`);
                if (pBreach) pBreach.setAttribute('value', `BREACHES: ${state.perimeter_monitor.breachCount}`);
            }

            if (state.smart_power_relay) {
                const rStatus = document.getElementById('popup-relay-status');
                const rPower = document.getElementById('popup-relay-power');

                if (rStatus) rStatus.setAttribute('value', `RELAY: ${state.smart_power_relay.status}`);
                if (rPower) rPower.setAttribute('value', `LOAD: ${state.smart_power_relay.powerDraw} kW`);
            }
        });

        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            const launch = () => {
                if (sceneEl.enterAR) sceneEl.enterAR();
                else if (sceneEl.enterVR) sceneEl.enterVR();
                button.style.display = 'none';
            };

            if (sceneEl.hasLoaded) launch();
            else sceneEl.addEventListener('loaded', launch);
        });
    </script>
</body>
</html>
