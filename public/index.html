<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // OPERATOR HUD & CONTROL</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body, .a-canvas {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: transparent !important;
            background: transparent !important;
        }
        #custom-ar-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 99999;
            padding: 16px 28px; background: #00f0ff; color: #000;
            border: none; border-radius: 8px; font-family: monospace;
            font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important;">

    <button id="custom-ar-btn">ENTER MOBILE WEBAR</button>

    <script>
        // Force Canvas Alpha Transparency for WebXR Passthrough
        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // Custom Component: Billboarding + Distance-Based Proximity Fading
        AFRAME.registerComponent('billboard-proximity', {
            schema: {
                maxDistance: { type: 'number', default: 3.5 },
                minDistance: { type: 'number', default: 0.5 }
            },
            init: function () {
                this.cameraEl = document.getElementById('main-camera');
            },
            tick: function () {
                if (!this.cameraEl) return;

                const nodePos = this.el.object3D.position;
                const camPos = this.cameraEl.object3D.position;

                // 1. BILLBOARDING: Always rotate node around Y-axis to face camera directly
                const dx = camPos.x - nodePos.x;
                const dz = camPos.z - nodePos.z;
                const angleY = Math.atan2(dx, dz);
                this.el.object3D.rotation.y = angleY;

                // 2. PROXIMITY FADING: Calculate 3D Euclidean distance
                const dist = nodePos.distanceTo(camPos);

                // Determine opacity (1.0 = fully visible, 0.0 = transparent/hidden)
                let opacity = 1.0;
                if (dist > this.data.maxDistance) {
                    opacity = 0.0;
                } else if (dist > (this.data.maxDistance - 1.0)) {
                    opacity = (this.data.maxDistance - dist); // Smooth linear fade out
                } else if (dist < this.data.minDistance) {
                    opacity = dist / this.data.minDistance;
                }

                // Apply opacity to all direct text and plane elements
                const isVisible = opacity > 0.05;
                this.el.setAttribute('visible', isVisible);
            }
        });

        // Gaze Hover Manager for HUD Popups
        AFRAME.registerComponent('gaze-hud-manager', {
            init: function () {
                this.el.addEventListener('raycaster-intersected', (evt) => {
                    const parentNode = this.el.parentElement;
                    const card = parentNode.querySelector('.info-card');
                    if (card) card.setAttribute('visible', 'true');
                });

                this.el.addEventListener('raycaster-intersected-cleared', (evt) => {
                    const parentNode = this.el.parentElement;
                    const card = parentNode.querySelector('.info-card');
                    if (card) card.setAttribute('visible', 'false');
                });
            }
        });
    </script>

    <a-scene 
        force-passthrough
        webxr="requiredFeatures: hit-test, local-floor; referenceSpaceType: local-floor;"
        renderer="colorManagement: true; antialias: true; alpha: true;" 
        xr-mode-ui="enabled: false">

        <!-- Camera Rig & Touch Mouse Raycaster -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity cursor="rayOrigin: mouse; fuse: false;"
                          raycaster="objects: .gaze-target, .interactive-btn; far: 5;"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                          material="color: #00f0ff; shader: flat; opacity: 0.8; depthTest: false;">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

        <!-- MAIN SPATIAL ANCHOR CONTAINER -->
        <a-entity id="noemata-spatial-anchor">

            <!-- 1. SMART CLIMATE NODE -->
            <a-entity id="smart-climate-asset" position="0 1.4 -1.2" billboard-proximity="maxDistance: 4.0; minDistance: 0.4;">
                <a-box class="gaze-target" gaze-hud-manager width="0.18" height="0.18" depth="0.18" material="color: #00f0ff; shader: flat; wireframe: true; depthTest: false;"></a-box>
                <a-text value="[ CLIMATE NODE ]" position="0 0.18 0" width="1.2" align="center" color="#00f0ff" font="monoid"></a-text>

                <!-- GAZE-ACTIVATED HUD CARD -->
                <a-entity class="info-card" position="0 0.38 0" visible="false">
                    <a-plane width="0.7" height="0.3" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-plane width="0.72" height="0.32" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-climate-status" value="CLIMATE: OPTIMAL" color="#00f0ff" width="1.1" position="-0.3 0.07 0.01" font="monoid"></a-text>
                    <a-text id="popup-climate-temp" value="TEMP: -- °F | HUM: --%" color="#ffffff" width="0.9" position="-0.3 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

            <!-- 2. PERIMETER MONITOR -->
            <a-entity id="perimeter-monitor-asset" position="-0.6 1.4 -1.5" billboard-proximity="maxDistance: 4.0; minDistance: 0.4;">
                <a-cylinder class="gaze-target" gaze-hud-manager radius="0.12" height="0.18" material="color: #00f0ff; shader: flat; wireframe: true; depthTest: false;"></a-cylinder>
                <a-text value="[ PERIMETER GUARD ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>

                <!-- GAZE-ACTIVATED HUD CARD -->
                <a-entity class="info-card" position="0 0.38 0" visible="false">
                    <a-plane width="0.65" height="0.3" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-plane width="0.67" height="0.32" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-perimeter-status" value="SHIELD: SECURE" color="#00f0ff" width="1.0" position="-0.27 0.06 0.01" font="monoid"></a-text>
                    <a-text id="popup-perimeter-breach" value="BREACHES: 0" color="#ff0055" width="0.8" position="-0.27 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

            <!-- 3. SMART POWER RELAY (WITH TWO-WAY CONTROL TOGGLE) -->
            <a-entity id="smart-relay-asset" position="0.6 1.4 -1.5" billboard-proximity="maxDistance: 4.0; minDistance: 0.4;">
                <a-box id="relay-3d-box" class="gaze-target" gaze-hud-manager width="0.15" height="0.15" depth="0.15" material="color: #64748b; shader: flat; wireframe: true; depthTest: false;"></a-box>
                <a-text value="[ POWER RELAY ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>

                <!-- GAZE-ACTIVATED HUD CARD WITH INTERACTIVE TOGGLE BUTTON -->
                <a-entity class="info-card" position="0 0.42 0" visible="false">
                    <a-plane width="0.75" height="0.4" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-plane width="0.77" height="0.42" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-relay-status" value="RELAY: OFF" color="#ffffff" width="1.0" position="-0.32 0.11 0.01" font="monoid"></a-text>
                    <a-text id="popup-relay-power" value="LOAD: 0.0 kW" color="#64748b" width="0.8" position="-0.32 0.02 0.01" font="monoid"></a-text>

                    <!-- INTERACTIVE SPATIAL BUTTON TO CONTROL PHYSICAL HARDWARE -->
                    <a-plane id="btn-toggle-relay" class="interactive-btn" width="0.6" height="0.12" color="#00f0ff" position="0 -0.10 0.02" material="shader: flat; depthTest: false;">
                        <a-text id="btn-toggle-text" value="[ TAP TO SWITCH POWER ]" color="#000000" width="1.1" align="center" position="0 0 0.01" font="monoid"></a-text>
                    </a-plane>
                </a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        // Apply saved positions from backend database
        function applyDynamicPositions(map) {
            if (!map) return;
            const targets = [
                { key: 'smart_climate_node', elementId: 'smart-climate-asset' },
                { key: 'perimeter_monitor', elementId: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', elementId: 'smart-relay-asset' }
            ];

            targets.forEach(item => {
                const data = map[item.key];
                const el = document.getElementById(item.elementId);
                if (data && el && data.x !== undefined) {
                    el.setAttribute('position', `${data.x} ${data.y} ${data.z}`);
                }
            });
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => applyDynamicPositions(db.anchors || db));

        socket.on('spatialAnchorsUpdated', (anchors) => applyDynamicPositions(anchors));

        // 1. Live Climate Telemetry
        socket.on('climateStateUpdate', (data) => {
            const tempText = document.getElementById('popup-climate-temp');
            const statusText = document.getElementById('popup-climate-status');
            const climateBox = document.querySelector('#smart-climate-asset a-box');

            if (tempText && statusText) {
                tempText.setAttribute('value', `TEMP: ${data.temperature} °F | HUM: ${data.humidity}%`);
                statusText.setAttribute('value', `CLIMATE: ${data.status}`);

                const isWarning = data.status === "OVERHEATING_WARNING";
                const activeColor = isWarning ? "#ff0055" : "#00f0ff";
                statusText.setAttribute('color', activeColor);
                if (climateBox) climateBox.setAttribute('material', 'color', activeColor);
            }
        });

        // 2. Live Twin State & Relay Updates
        socket.on('twinStateUpdate', (state) => {
            if (state.perimeter_monitor) {
                const pStatus = document.getElementById('popup-perimeter-status');
                const pBreach = document.getElementById('popup-perimeter-breach');
                const pCylinder = document.querySelector('#perimeter-monitor-asset a-cylinder');

                const isBreached = state.perimeter_monitor.perimeter === "BREACH_ALERT";
                const pColor = isBreached ? "#ff0055" : "#00f0ff";

                if (pStatus) {
                    pStatus.setAttribute('value', `SHIELD: ${state.perimeter_monitor.perimeter}`);
                    pStatus.setAttribute('color', pColor);
                }
                if (pBreach) pBreach.setAttribute('value', `BREACHES: ${state.perimeter_monitor.breachCount}`);
                if (pCylinder) pCylinder.setAttribute('material', 'color', pColor);
            }

            if (state.smart_power_relay) {
                const rStatus = document.getElementById('popup-relay-status');
                const rPower = document.getElementById('popup-relay-power');
                const rBox = document.getElementById('relay-3d-box');
                const btnToggle = document.getElementById('btn-toggle-relay');

                const isRelayOn = state.smart_power_relay.status === "ON";
                const rColor = isRelayOn ? "#00f0ff" : "#64748b";

                if (rStatus) {
                    rStatus.setAttribute('value', `RELAY: ${state.smart_power_relay.status}`);
                    rStatus.setAttribute('color', isRelayOn ? "#00f0ff" : "#ffffff");
                }
                if (rPower) rPower.setAttribute('value', `LOAD: ${state.smart_power_relay.powerDraw} kW`);
                if (rBox) rBox.setAttribute('material', 'color', rColor);
                if (btnToggle) btnToggle.setAttribute('color', isRelayOn ? "#ff0055" : "#00f0ff");
            }
        });

        // ==============================================================
        // TWO-WAY CONTROL TRIGGER (TOGGLE HARDWARE)
        // ==============================================================
        function triggerRelayToggle(e) {
            if (e) e.stopPropagation();
            console.log("[WEBAR] Toggling physical power relay...");
            
            // Method 1: Emit via Socket.io
            socket.emit('toggleRelay');

            // Method 2: Fallback HTTPS POST Endpoint
            fetch('/api/hardware/relay/toggle', { method: 'POST' })
                .catch(err => console.error("Toggle request failed:", err));
        }

        // Bind click listeners to both the 3D box and the HUD button
        document.getElementById('btn-toggle-relay').addEventListener('click', triggerRelayToggle);
        document.getElementById('relay-3d-box').addEventListener('click', triggerRelayToggle);

        // Native WebAR Launcher
        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            if (sceneEl.enterAR) {
                sceneEl.enterAR();
            } else if (sceneEl.enterVR) {
                sceneEl.enterVR();
            }
            button.style.display = 'none';
        });
    </script>
</body>
</html>
