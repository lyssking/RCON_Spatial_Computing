<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL AR VIEWER</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important; background: transparent !important;">

    <script>
        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });
    </script>

    <a-scene webxr="optionalFeatures: anchors, unbounded, local-floor; referenceSpaceType: local-floor;"
             force-ar-passthrough
             background="transparent: true"
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="mode: ar"
             style="background-color: rgba(0,0,0,0) !important; background: transparent !important;">
        
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity id="hud-pointer"
                          raycaster="objects: .gaze-target; far: 10;"
                          cursor="fuse: false;" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.003; radiusOuter: 0.006"
                          material="color: #00f0ff; shader: flat; opacity: 0.4">
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- 1. SMART CLIMATE NODE -->
        <a-entity class="gaze-target" id="smart-climate-asset"
                  geometry="primitive: box; width: 0.16; height: 0.16; depth: 0.16" 
                  material="color: #00f0ff; wireframe: true; opacity: 0.8" 
                  position="0 -10 0">
            
            <a-text value="[ NOEMATA // CLIMATE NODE ]" position="0 0.16 0" width="1.2" align="center" color="#00f0ff" font="monoid"></a-text>

            <a-entity class="info-card" position="0 0.35 0" visible="false" scale="0.001 0.001 0.001">
                <a-plane width="0.6" height="0.28" color="#121620" opacity="0.9" material="shader:flat"></a-plane>
                <a-text id="popup-climate-status" value="CLIMATE: OPTIMAL" color="#00f0ff" width="1.1" position="-0.26 0.07 0.01" font="monoid"></a-text>
                <a-text id="popup-climate-temp" value="TEMP: -- °F | HUM: --%" color="#ffffff" width="0.9" position="-0.26 -0.04 0.01" font="monoid"></a-text>
            </a-entity>
        </a-entity>

        <!-- 2. PERIMETER MONITOR -->
        <a-entity class="gaze-target" id="perimeter-monitor-asset"
                  geometry="primitive: cylinder; radius: 0.12; height: 0.18" 
                  material="color: #00f0ff; wireframe: true; opacity: 0.8" 
                  position="0 -10 0">
            
            <a-text value="[ NOEMATA // PERIMETER GUARD ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>

            <a-entity class="info-card" position="0 0.35 0" visible="false" scale="0.001 0.001 0.001">
                <a-plane width="0.55" height="0.25" color="#121620" opacity="0.9" material="shader:flat"></a-plane>
                <a-text id="popup-perimeter-status" value="SHIELD: SECURE" color="#00f0ff" width="1.1" position="-0.23 0.06 0.01" font="monoid"></a-text>
                <a-text id="popup-perimeter-breach" value="BREACHES: 0" color="#ff0055" width="0.9" position="-0.23 -0.04 0.01" font="monoid"></a-text>
            </a-entity>
        </a-entity>

        <!-- 3. SMART POWER RELAY -->
        <a-entity class="gaze-target" id="smart-relay-asset"
                  geometry="primitive: box; width: 0.15; height: 0.15; depth: 0.15" 
                  material="color: #64748b; wireframe: true; opacity: 0.8" 
                  position="0 -10 0">
            
            <a-text value="[ NOEMATA // POWER RELAY ]" position="0 0.15 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>

            <a-entity class="info-card" position="0 0.35 0" visible="false" scale="0.001 0.001 0.001">
                <a-plane width="0.55" height="0.25" color="#121620" opacity="0.9" material="shader:flat"></a-plane>
                <a-text id="popup-relay-status" value="RELAY: OFF" color="#ffffff" width="1.1" position="-0.23 0.06 0.01" font="monoid"></a-text>
                <a-text id="popup-relay-power" value="LOAD: 0.0 kW" color="#64748b" width="0.9" position="-0.23 -0.04 0.01" font="monoid"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        const sceneEl = document.querySelector('a-scene');

        async function applyRegisteredAnchors(map) {
            const session = sceneEl.xrSession;

            const targets = [
                { key: 'smart_climate_node', elementId: 'smart-climate-asset' },
                { key: 'perimeter_monitor', elementId: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', elementId: 'smart-relay-asset' }
            ];

            for (const item of targets) {
                const data = map[item.key];
                const el = document.getElementById(item.elementId);

                if (data && el) {
                    let restored = false;

                    if (session && data.anchorUUID && session.restorePersistentAnchor) {
                        try {
                            const anchor = await session.restorePersistentAnchor(data.anchorUUID);
                            if (anchor) {
                                restored = true;
                                console.log(`[NOEMATA ANCHOR LOCALIZED] ${item.key}`);
                            }
                        } catch (e) {
                            console.warn(`[NOEMATA ANCHOR FALLBACK] ${item.key}:`, e);
                        }
                    }

                    if (!restored && data.x !== undefined) {
                        el.setAttribute('position', `${data.x} ${data.y} ${data.z}`);
                    }
                }
            }
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(map => applyRegisteredAnchors(map))
            .catch(err => console.error("Map Fetch Error:", err));

        socket.on('spatialAnchorsUpdated', (map) => applyRegisteredAnchors(map));

        document.querySelectorAll('.gaze-target').forEach(el => {
            const card = el.querySelector('.info-card');
            el.addEventListener('raycaster-intersected', () => {
                card.setAttribute('visible', 'true');
                card.setAttribute('scale', '1 1 1');
            });
            el.addEventListener('raycaster-intersected-cleared', () => {
                card.setAttribute('visible', 'false');
                card.setAttribute('scale', '0.001 0.001 0.001');
            });
        });

        socket.on('climateStateUpdate', (data) => {
            const tempText = document.getElementById('popup-climate-temp');
            const statusText = document.getElementById('popup-climate-status');
            const assetMesh = document.getElementById('smart-climate-asset');

            if (tempText && statusText) {
                tempText.setAttribute('value', `TEMP: ${data.temperature} °F | HUM: ${data.humidity}%`);
                statusText.setAttribute('value', `CLIMATE: ${data.status}`);
                
                const activeColor = data.status === "OVERHEATING_WARNING" ? "#ff0055" : "#00f0ff";
                statusText.setAttribute('color', activeColor);
                if (assetMesh) assetMesh.setAttribute('material', 'color', activeColor);
            }
        });

        socket.on('twinStateUpdate', (state) => {
            if (state.perimeter_monitor) {
                const pStatus = document.getElementById('popup-perimeter-status');
                const pBreach = document.getElementById('popup-perimeter-breach');
                const pAsset = document.getElementById('perimeter-monitor-asset');

                const isBreached = state.perimeter_monitor.perimeter === "BREACH_ALERT";
                const pColor = isBreached ? "#ff0055" : "#00f0ff";

                if (pStatus) pStatus.setAttribute('value', `SHIELD: ${state.perimeter_monitor.perimeter}`);
                if (pStatus) pStatus.setAttribute('color', pColor);
                if (pBreach) pBreach.setAttribute('value', `BREACHES: ${state.perimeter_monitor.breachCount}`);
                if (pAsset) pAsset.setAttribute('material', 'color', pColor);
            }

            if (state.smart_power_relay) {
                const rStatus = document.getElementById('popup-relay-status');
                const rPower = document.getElementById('popup-relay-power');
                const rAsset = document.getElementById('smart-relay-asset');

                const isRelayOn = state.smart_power_relay.status === "ON";
                const rColor = isRelayOn ? "#00f0ff" : "#64748b";

                if (rStatus) rStatus.setAttribute('value', `RELAY: ${state.smart_power_relay.status}`);
                if (rStatus) rStatus.setAttribute('color', isRelayOn ? "#00f0ff" : "#ffffff");
                if (rPower) rPower.setAttribute('value', `LOAD: ${state.smart_power_relay.powerDraw} kW`);
                if (rAsset) rAsset.setAttribute('material', 'color', rColor);
            }
        });
    </script>
</body>
</html>
