<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NOEMATA // OPERATOR SPATIAL HUD</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- jsQR scanner engine -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        html, body, .a-canvas {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
            background-color: transparent !important;
            background: transparent !important;
            touch-action: none; user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        /* 1. PRE-AR DOORFRAME SCANNER MODAL */
        #door-scan-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            box-sizing: border-box; padding: 25px 20px;
            z-index: 100000;
        }

        .scan-header {
            text-align: center;
            color: #00f0ff;
        }

        .scan-header h1 {
            font-size: 17px; margin: 0 0 6px 0; letter-spacing: 1px;
        }

        .scan-header p {
            color: #94a3b8; font-size: 12px; margin: 0;
        }

        .scanner-frame-box {
            position: relative;
            width: 250px; height: 250px;
            border: 2px solid #00f0ff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            background: #000;
        }

        #scanner-video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .crosshair-reticle {
            position: absolute; width: 170px; height: 170px;
            border: 1px dashed rgba(57, 255, 20, 0.8);
            border-radius: 8px;
            pointer-events: none;
        }

        #scan-status {
            color: #39ff14; font-family: monospace; font-size: 13px;
            margin-top: 12px; text-align: center;
        }

        .action-btn {
            background: #00f0ff; color: #000000; border: none;
            padding: 16px 28px; border-radius: 8px; font-family: monospace;
            font-size: 15px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            display: none; width: 100%; max-width: 280px;
        }

        .bypass-btn {
            background: #1e293b; color: #94a3b8; border: 1px solid #30363d;
            padding: 10px 18px; border-radius: 6px; font-family: monospace;
            font-size: 12px; cursor: pointer; margin-top: 10px;
        }

        /* 2. STAGNANT 2D SCREEN OVERLAY DURING AR */
        #mobile-ar-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box; padding: 16px;
            z-index: 10000;
        }

        .ar-status-banner {
            background: rgba(13, 17, 23, 0.9);
            border: 1px solid #00f0ff;
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            backdrop-filter: blur(8px);
            text-align: center;
            pointer-events: auto;
        }

        .ar-status-banner h2 {
            margin: 0; font-size: 13px; color: #00f0ff; letter-spacing: 1px;
        }

        .ar-status-banner span {
            font-size: 11px; color: #39ff14; font-family: monospace;
        }

        .ar-control-bar {
            display: flex; gap: 10px; pointer-events: auto; width: 100%;
        }

        .ar-btn {
            flex: 1; padding: 14px 8px; border-radius: 8px;
            border: none; font-family: monospace; font-weight: bold;
            font-size: 12px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #btn-resync {
            background: #1e293b; color: #00f0ff; border: 1px solid #00f0ff;
        }

        #btn-hardware-toggle {
            background: #00f0ff; color: #000000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important;">

    <!-- 1. PRE-AR DOORFRAME SCANNER SCREEN -->
    <div id="door-scan-screen">
        <div class="scan-header">
            <h1>NOEMATA // SPATIAL VIEWER</h1>
            <p>Scan Doorframe QR to calibrate room coordinates</p>
        </div>

        <div class="scanner-frame-box">
            <video id="scanner-video" playsinline muted autoplay></video>
            <div class="crosshair-reticle"></div>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div id="scan-status">> Point camera at Doorframe QR...</div>
            <button class="action-btn" id="btn-enter-ar">ENTER MOBILE AR</button>
            <button class="bypass-btn" id="btn-manual-launch">SKIP SCAN & LAUNCH</button>
        </div>
    </div>

    <!-- 2. STAGNANT 2D OVERLAY IN WEBAR -->
    <div id="mobile-ar-overlay" style="display: none;">
        <div class="ar-status-banner">
            <h2>ROOM TWIN ACTIVE</h2>
            <span id="overlay-sync-state">FACILITY SPATIAL MAP LOADED</span>
        </div>

        <div class="ar-control-bar">
            <button class="ar-btn" id="btn-resync">RE-SYNC AT DOOR</button>
            <button class="ar-btn" id="btn-hardware-toggle">POWER RELAY: TOGGLE</button>
        </div>
    </div>

    <script>
        // Force WebGL Canvas Transparency for AR Passthrough
        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // Billboard Component: Ensures 3D HUD panels continuously rotate to face phone camera
        AFRAME.registerComponent('billboard', {
            tick: function () {
                const cam = document.getElementById('main-camera');
                if (!cam) return;
                const nodePos = this.el.object3D.position;
                const camPos = cam.object3D.position;
                const angleY = Math.atan2(camPos.x - nodePos.x, camPos.z - nodePos.z);
                this.el.object3D.rotation.y = angleY;
            }
        });

        // Gaze Hover Component
        AFRAME.registerComponent('gaze-hud-manager', {
            init: function () {
                this.el.addEventListener('raycaster-intersected', () => {
                    const card = this.el.parentElement.querySelector('.info-card');
                    if (card) card.setAttribute('visible', 'true');
                });
                this.el.addEventListener('raycaster-intersected-cleared', () => {
                    const card = this.el.parentElement.querySelector('.info-card');
                    if (card) card.setAttribute('visible', 'false');
                });
            }
        });
    </script>

    <!-- Native A-Frame Scene -->
    <a-scene force-passthrough
             webxr="requiredFeatures: local-floor; optionalFeatures: dom-overlay; overlayElement: #mobile-ar-overlay; referenceSpaceType: local-floor;"
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">

        <!-- Camera Rig & Center Reticle -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity cursor="fuse: false;"
                          raycaster="objects: .gaze-target, .interactive-btn; far: 10;"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                          material="color: #00f0ff; shader: flat; opacity: 0.8; depthTest: false;">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

        <!-- MASTER WORLD ZERO CONTAINER -->
        <a-entity id="noemata-spatial-anchor" position="0 0 0">

            <!-- 1. SMART CLIMATE NODE -->
            <a-entity id="smart-climate-asset" position="-0.868 1.4 -1.2" billboard>
                <a-box class="gaze-target" gaze-hud-manager width="0.18" height="0.18" depth="0.18" material="color: #00f0ff; shader: flat; wireframe: true; depthTest: false;"></a-box>
                <a-text value="[ CLIMATE NODE ]" position="0 0.18 0" width="1.3" align="center" color="#00f0ff" font="monoid"></a-text>

                <a-entity class="info-card" position="0 0.40 0" visible="false">
                    <a-plane width="0.72" height="0.32" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-plane width="0.74" height="0.34" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-climate-status" value="CLIMATE: OPTIMAL" color="#00f0ff" width="1.1" position="-0.32 0.08 0.01" font="monoid"></a-text>
                    <a-text id="popup-climate-temp" value="TEMP: -- °F | HUM: --%" color="#ffffff" width="0.95" position="-0.32 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

            <!-- 2. PERIMETER MONITOR -->
            <a-entity id="perimeter-monitor-asset" position="1.051 1.4 -1.8" billboard>
                <a-cylinder class="gaze-target" gaze-hud-manager radius="0.12" height="0.18" material="color: #00f0ff; shader: flat; wireframe: true; depthTest: false;"></a-cylinder>
                <a-text value="[ PERIMETER GUARD ]" position="0 0.18 0" width="1.3" align="center" color="#64748b" font="monoid"></a-text>

                <a-entity class="info-card" position="0 0.40 0" visible="false">
                    <a-plane width="0.68" height="0.32" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-plane width="0.70" height="0.34" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-perimeter-status" value="SHIELD: SECURE" color="#00f0ff" width="1.0" position="-0.29 0.07 0.01" font="monoid"></a-text>
                    <a-text id="popup-perimeter-breach" value="BREACHES: 0" color="#ff0055" width="0.85" position="-0.29 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

            <!-- 3. SMART POWER RELAY -->
            <a-entity id="smart-relay-asset" position="1.716 1.4 -1.5" billboard>
                <a-box id="relay-3d-box" class="gaze-target" gaze-hud-manager width="0.15" height="0.15" depth="0.15" material="color: #64748b; shader: flat; wireframe: true; depthTest: false;"></a-box>
                <a-text value="[ POWER RELAY ]" position="0 0.18 0" width="1.3" align="center" color="#64748b" font="monoid"></a-text>

                <a-entity class="info-card" position="0 0.40 0" visible="false">
                    <a-plane width="0.68" height="0.32" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
                    <a-plane width="0.70" height="0.34" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-relay-status" value="RELAY: OFF" color="#ffffff" width="1.0" position="-0.29 0.07 0.01" font="monoid"></a-text>
                    <a-text id="popup-relay-power" value="LOAD: 0.0 kW" color="#64748b" width="0.85" position="-0.29 -0.04 0.01" font="monoid"></a-text>
                </a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        // Apply Database Coordinates
        function applyDynamicPositions(map) {
            if (!map) return;
            const targets = [
                { key: 'smart_climate_node', elementId: 'smart-climate-asset' },
                { key: 'perimeter_monitor', elementId: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', elementId: 'smart-relay-asset' }
            ];

            targets.forEach(item => {
                const data = map[item.key];
                const el = document.getElementById(item.elementId);
                if (data && el && data.x !== undefined) {
                    // Normalize Y to minimum eye-level if negative
                    const posY = parseFloat(data.y) < 0 ? (1.4 + parseFloat(data.y)).toFixed(3) : data.y;
                    el.setAttribute('position', `${data.x} ${posY} ${data.z}`);
                }
            });
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => applyDynamicPositions(db.anchors || db));

        socket.on('spatialAnchorsUpdated', (anchors) => applyDynamicPositions(anchors));

        // ==============================================================
        // PRE-AR CAMERA SCANNER WITH DIRECT USER GESTURE UNLOCK
        // ==============================================================
        const videoEl = document.getElementById('scanner-video');
        const scanStatus = document.getElementById('scan-status');
        const enterArBtn = document.getElementById('btn-enter-ar');
        const doorScanScreen = document.getElementById('door-scan-screen');
        const arOverlay = document.getElementById('mobile-ar-overlay');
        let cameraStream = null;
        let scanInterval = null;

        async function initDoorframeCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoEl.srcObject = cameraStream;
                startQRInspection();
            } catch (err) {
                scanStatus.innerText = "> Camera preview busy. Tap skip to start.";
                enterArBtn.style.display = 'block';
            }
        }

        function startQRInspection() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            scanInterval = setInterval(() => {
                if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                    canvas.width = videoEl.videoWidth;
                    canvas.height = videoEl.videoHeight;
                    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    const code = jsQR(imgData.data, imgData.width, imgData.height);
                    if (code && (code.data.includes("doorframe") || code.data.includes("noemata"))) {
                        clearInterval(scanInterval);
                        scanStatus.innerText = `> QR DETECTED! TAP BUTTON TO ENTER.`;
                        scanStatus.style.color = "#00f0ff";
                        enterArBtn.style.display = 'block';
                    }
                }
            }, 120);
        }

        function stopPreArCamera() {
            clearInterval(scanInterval);
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            if (videoEl.srcObject) {
                videoEl.srcObject = null;
            }
        }

        // DIRECT USER-GESTURE HANDLER (Fixes mobile WebXR security rejection)
        function triggerEnterAR() {
            stopPreArCamera();
            doorScanScreen.style.display = 'none';
            arOverlay.style.display = 'flex';

            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.enterAR) {
                sceneEl.enterAR();
            } else if (sceneEl.enterVR) {
                sceneEl.enterVR();
            }

            // Recenter to current phone pose
            setTimeout(() => {
                const cameraEl = document.getElementById('main-camera');
                const spatialAnchor = document.getElementById('noemata-spatial-anchor');
                if (cameraEl && spatialAnchor) {
                    const camPos = cameraEl.object3D.position;
                    const camRot = cameraEl.object3D.rotation;
                    spatialAnchor.object3D.position.set(camPos.x, 0, camPos.z);
                    spatialAnchor.object3D.rotation.set(0, camRot.y, 0);
                }
            }, 300);
        }

        enterArBtn.addEventListener('click', triggerEnterAR);
        document.getElementById('btn-manual-launch').addEventListener('click', triggerEnterAR);

        // Re-sync Button in AR
        document.getElementById('btn-resync').addEventListener('click', (e) => {
            e.stopPropagation();
            const cameraEl = document.getElementById('main-camera');
            const spatialAnchor = document.getElementById('noemata-spatial-anchor');
            if (cameraEl && spatialAnchor) {
                const camPos = cameraEl.object3D.position;
                const camRot = cameraEl.object3D.rotation;
                spatialAnchor.object3D.position.set(camPos.x, 0, camPos.z);
                spatialAnchor.object3D.rotation.set(0, camRot.y, 0);
                document.getElementById('overlay-sync-state').innerText = "ORIGIN RE-ZEROED AT DOOR";
            }
        });

        // Hardware Toggle Button
        document.getElementById('btn-hardware-toggle').addEventListener('click', (e) => {
            e.stopPropagation();
            fetch('/api/hardware/relay/toggle', { method: 'POST' })
                .catch(err => console.error("Toggle failed:", err));
        });

        // ==============================================================
        // TELEMETRY SOCKET LISTENERS
        // ==============================================================
        socket.on('climateStateUpdate', (data) => {
            const tempText = document.getElementById('popup-climate-temp');
            const statusText = document.getElementById('popup-climate-status');
            const climateBox = document.querySelector('#smart-climate-asset a-box');

            if (tempText && statusText) {
                tempText.setAttribute('value', `TEMP: ${data.temperature} °F | HUM: ${data.humidity}%`);
                statusText.setAttribute('value', `CLIMATE: ${data.status}`);

                const isWarning = data.status === "OVERHEATING_WARNING";
                const activeColor = isWarning ? "#ff0055" : "#00f0ff";
                statusText.setAttribute('color', activeColor);
                if (climateBox) climateBox.setAttribute('material', 'color', activeColor);
            }
        });

        socket.on('twinStateUpdate', (state) => {
            if (state.perimeter_monitor) {
                const pStatus = document.getElementById('popup-perimeter-status');
                const pBreach = document.getElementById('popup-perimeter-breach');
                const pCylinder = document.querySelector('#perimeter-monitor-asset a-cylinder');

                const isBreached = state.perimeter_monitor.perimeter === "BREACH_ALERT";
                const pColor = isBreached ? "#ff0055" : "#00f0ff";

                if (pStatus) {
                    pStatus.setAttribute('value', `SHIELD: ${state.perimeter_monitor.perimeter}`);
                    pStatus.setAttribute('color', pColor);
                }
                if (pBreach) pBreach.setAttribute('value', `BREACHES: ${state.perimeter_monitor.breachCount}`);
                if (pCylinder) pCylinder.setAttribute('material', 'color', pColor);
            }

            if (state.smart_power_relay) {
                const rStatus = document.getElementById('popup-relay-status');
                const rPower = document.getElementById('popup-relay-power');
                const rBox = document.getElementById('relay-3d-box');
                const toggleBtn = document.getElementById('btn-hardware-toggle');

                const isRelayOn = state.smart_power_relay.status === "ON";
                const rColor = isRelayOn ? "#00f0ff" : "#64748b";

                if (rStatus) {
                    rStatus.setAttribute('value', `RELAY: ${state.smart_power_relay.status}`);
                    rStatus.setAttribute('color', isRelayOn ? "#00f0ff" : "#ffffff");
                }
                if (rPower) rPower.setAttribute('value', `LOAD: ${state.smart_power_relay.powerDraw} kW`);
                if (rBox) rBox.setAttribute('material', 'color', rColor);
                if (toggleBtn) {
                    toggleBtn.style.background = isRelayOn ? "#ff0055" : "#00f0ff";
                    toggleBtn.innerText = `POWER RELAY: ${state.smart_power_relay.status}`;
                }
            }
        });

        window.addEventListener('DOMContentLoaded', initDoorframeCamera);
    </script>
</body>
</html>
