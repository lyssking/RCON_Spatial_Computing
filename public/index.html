<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Noemata // QR-Zeroed Industrial AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --bg-card: rgba(15, 23, 42, 0.88);
            --border: rgba(255, 255, 255, 0.12);
            --success: #34d399;
            --text: #f8fafc;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
        }

        .a-canvas { background-color: transparent !important; }

        /* PRE-AR QR SCANNER OVERLAY */
        #qr-scanner-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #090d16; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            box-sizing: border-box; padding: 48px 24px; z-index: 100000;
        }

        .scanner-frame {
            position: relative; width: 260px; height: 260px;
            border-radius: 20px; overflow: hidden; background: #000;
            border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        #qr-video { width: 100%; height: 100%; object-fit: cover; }

        .btn-launch {
            width: 100%; max-width: 300px; padding: 16px; background: #fff;
            color: #0f172a; border-radius: 14px; font-size: 16px; font-weight: 700;
            border: none; cursor: pointer; display: none;
        }

        #mobile-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; padding: 20px 16px; pointer-events: none; z-index: 10000;
        }

        .status-pill {
            align-self: center; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 8px 18px; font-size: 13px; font-weight: 600;
            backdrop-filter: blur(16px); pointer-events: auto;
            display: flex; align-items: center; gap: 8px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

        .btn-bottom-bar { display: flex; gap: 10px; pointer-events: auto; width: 100%; }

        .btn {
            flex: 1; padding: 15px 12px; border-radius: 14px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: 1px solid var(--border); background: var(--bg-card);
            color: #fff; backdrop-filter: blur(16px);
        }

        #btn-power { background: #fff; color: #0f172a; border: none; }
    </style>
</head>
<body>

    <!-- 1. QR CODE SCANNER -->
    <div id="qr-scanner-screen">
        <div style="text-align: center;">
            <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 6px 0;">Noemata AR</h1>
            <p style="color: #94a3b8; margin: 0; font-size: 14px;">Point camera at doorframe QR sticker</p>
        </div>

        <div class="scanner-frame">
            <video id="qr-video" playsinline muted autoplay></video>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div id="scan-status" style="color: #94a3b8; font-size: 13px;">Searching for Datum QR Code...</div>
            <button class="btn-launch" id="btn-enter-ar">ENTER (DATUM LOCKED)</button>
        </div>
    </div>

    <!-- 2. LIVE HUD -->
    <div id="mobile-hud" style="display: none;">
        <div class="status-pill">
            <div class="dot"></div>
            <span id="hud-status">Aligned to QR Code (0,0,0)</span>
        </div>
        <div class="btn-bottom-bar">
            <button class="btn" id="btn-resync">Re-Sync Datum</button>
            <button class="btn" id="btn-power">Power: Toggle</button>
        </div>
    </div>

    <script>
        AFRAME.registerComponent('billboard', {
            tick: function () {
                const cam = document.getElementById('main-camera');
                if (!cam) return;
                const nodePos = this.el.object3D.position;
                const camPos = cam.object3D.position;
                this.el.object3D.rotation.y = Math.atan2(camPos.x - nodePos.x, camPos.z - nodePos.z);
            }
        });
    </script>

    <a-scene webxr="optionalFeatures: local-floor;"
             renderer="alpha: true; antialias: true;"
             xr-mode-ui="enabled: false">

        <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        <a-entity light="type: ambient; intensity: 1.5;"></a-entity>

        <!-- QR DATUM ROOT (0,0,0 is exactly at the QR sticker) -->
        <a-entity id="qr-datum-root" position="0 0 0">

            <!-- 1. CLIMATE NODE -->
            <a-entity id="smart-climate-asset" position="-0.85 2.10 -2.40" billboard>
                <a-box width="0.14" height="0.14" depth="0.14" material="color: #38bdf8; opacity: 0.9;"></a-box>
                <a-text value="Climate Sensor" position="0 0.16 0" width="1.2" align="center" color="#ffffff" font="roboto"></a-text>
                <a-plane width="0.75" height="0.30" color="#0f172a" opacity="0.92" position="0 0.42 0">
                    <a-text id="txt-climate-status" value="STATUS: OPTIMAL" color="#34d399" position="-0.32 0.07 0.01" width="1.0" font="roboto"></a-text>
                    <a-text id="txt-climate-metrics" value="72.4 °F · 45.0% RH" color="#ffffff" position="-0.32 -0.04 0.01" width="0.95" font="roboto"></a-text>
                </a-plane>
            </a-entity>

            <!-- 2. PERIMETER GUARD -->
            <a-entity id="perimeter-monitor-asset" position="1.20 2.40 -3.10" billboard>
                <a-cylinder radius="0.08" height="0.16" material="color: #60a5fa; opacity: 0.9;"></a-cylinder>
                <a-text value="Perimeter Monitor" position="0 0.16 0" width="1.2" align="center" color="#ffffff" font="roboto"></a-text>
                <a-plane width="0.75" height="0.30" color="#0f172a" opacity="0.92" position="0 0.42 0">
                    <a-text id="txt-perimeter-status" value="SHIELD: SECURE" color="#34d399" position="-0.32 0.07 0.01" width="1.0" font="roboto"></a-text>
                    <a-text id="txt-perimeter-dist" value="Clearance: 28 in" color="#94a3b8" position="-0.32 -0.04 0.01" width="0.95" font="roboto"></a-text>
                </a-plane>
            </a-entity>

            <!-- 3. POWER RELAY -->
            <a-entity id="smart-relay-asset" position="1.45 1.20 -1.80" billboard>
                <a-box id="relay-3d-box" width="0.14" height="0.14" depth="0.14" material="color: #34d399; opacity: 0.9;"></a-box>
                <a-text value="Power Relay" position="0 0.16 0" width="1.2" align="center" color="#ffffff" font="roboto"></a-text>
                <a-plane width="0.75" height="0.30" color="#0f172a" opacity="0.92" position="0 0.42 0">
                    <a-text id="txt-relay-status" value="RELAY: ON" color="#34d399" position="-0.32 0.07 0.01" width="1.0" font="roboto"></a-text>
                    <a-text id="txt-relay-load" value="Load: 1.42 kW" color="#ffffff" position="-0.32 -0.04 0.01" width="0.95" font="roboto"></a-text>
                </a-plane>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        function applyPositions(anchors) {
            if (!anchors) return;
            const map = [
                { key: 'smart_climate_node', id: 'smart-climate-asset' },
                { key: 'perimeter_monitor', id: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', id: 'smart-relay-asset' }
            ];

            map.forEach(item => {
                const data = anchors[item.key];
                const el = document.getElementById(item.id);
                if (data && el && data.x !== undefined) {
                    el.setAttribute('position', `${data.x} ${data.y} ${data.z}`);
                }
            });
        }

        fetch('/api/spatial/map').then(r => r.json()).then(d => applyPositions(d.anchors || d));
        socket.on('spatialAnchorsUpdated', anchors => applyPositions(anchors));

        // QR Code Scanner Logic
        const videoEl = document.getElementById('qr-video');
        const scanStatus = document.getElementById('scan-status');
        const btnEnter = document.getElementById('btn-enter-ar');
        let cameraStream = null;
        let scanInterval = null;

        async function initScanner() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoEl.srcObject = cameraStream;
                startScanning();
            } catch (e) {
                scanStatus.innerText = "Camera direct bypass ready";
                btnEnter.style.display = 'block';
            }
        }

        function startScanning() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            scanInterval = setInterval(() => {
                if (videoEl && videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                    canvas.width = videoEl.videoWidth;
                    canvas.height = videoEl.videoHeight;
                    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imgData.data, imgData.width, imgData.height);

                    if (code) {
                        clearInterval(scanInterval);
                        scanStatus.innerText = "QR DATUM MATCHED!";
                        scanStatus.style.color = "#34d399";
                        btnEnter.style.display = 'block';
                    }
                }
            }, 100);
        }

        function zeroRootToCamera() {
            const cam = document.getElementById('main-camera');
            const root = document.getElementById('qr-datum-root');
            if (cam && root) {
                // Places QR datum root directly at the scanned physical sticker position
                root.object3D.position.set(cam.object3D.position.x, cam.object3D.position.y, cam.object3D.position.z);
            }
        }

        btnEnter.addEventListener('click', () => {
            clearInterval(scanInterval);
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());

            document.getElementById('qr-scanner-screen').style.display = 'none';
            document.getElementById('mobile-hud').style.display = 'flex';

            const scene = document.querySelector('a-scene');
            if (scene.enterVR) scene.enterVR();

            setTimeout(zeroRootToCamera, 200);
        });

        document.getElementById('btn-resync').addEventListener('click', (e) => {
            e.stopPropagation();
            zeroRootToCamera();
        });

        document.getElementById('btn-power').addEventListener('click', (e) => {
            e.stopPropagation();
            fetch('/api/hardware/relay/toggle', { method: 'POST' });
        });

        // Telemetry handlers
        socket.on('climateStateUpdate', d => {
            const statusEl = document.getElementById('txt-climate-status');
            const metricsEl = document.getElementById('txt-climate-metrics');
            if (metricsEl) metricsEl.setAttribute('value', `${d.temperature} °F · ${d.humidity}% RH`);
            if (statusEl) {
                statusEl.setAttribute('value', `STATUS: ${d.status}`);
                statusEl.setAttribute('color', d.status === "OVERHEATING_WARNING" ? "#f87171" : "#34d399");
            }
        });

        socket.on('twinStateUpdate', s => {
            if (s.perimeter_monitor) {
                const statusEl = document.getElementById('txt-perimeter-status');
                const distEl = document.getElementById('txt-perimeter-dist');
                const isBreach = s.perimeter_monitor.perimeter === "BREACH_ALERT";
                if (statusEl) {
                    statusEl.setAttribute('value', `SHIELD: ${s.perimeter_monitor.perimeter}`);
                    statusEl.setAttribute('color', isBreach ? "#f87171" : "#34d399");
                }
                if (distEl) distEl.setAttribute('value', `Clearance: ${s.perimeter_monitor.distance} in`);
            }

            if (s.smart_power_relay) {
                const statusEl = document.getElementById('txt-relay-status');
                const loadEl = document.getElementById('txt-relay-load');
                const boxEl = document.getElementById('relay-3d-box');
                const btn = document.getElementById('btn-power');
                const isOn = s.smart_power_relay.status === "ON";

                if (statusEl) {
                    statusEl.setAttribute('value', `RELAY: ${s.smart_power_relay.status}`);
                    statusEl.setAttribute('color', isOn ? "#34d399" : "#94a3b8");
                }
                if (loadEl) loadEl.setAttribute('value', `Load: ${s.smart_power_relay.powerDraw} kW`);
                if (boxEl) boxEl.setAttribute('material', 'color', isOn ? "#34d399" : "#94a3b8");
                if (btn) btn.innerText = `Power: ${s.smart_power_relay.status}`;
            }
        });

        window.addEventListener('DOMContentLoaded', initScanner);
    </script>
</body>
</html>
