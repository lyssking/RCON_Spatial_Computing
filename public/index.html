<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Noemata // Industrial Telemetry</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        :root {
            --bg-glass: rgba(18, 20, 24, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent: #2563eb;
            --accent-glow: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }

        html, body, .a-canvas {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden;
            background-color: transparent !important;
            background: transparent !important;
            touch-action: none; user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-primary);
        }

        /* 1. CLEAN SCANNER SCREEN */
        #door-scan-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #090a0f;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            box-sizing: border-box; padding: 48px 24px;
            z-index: 100000;
        }

        .scan-header {
            text-align: center;
        }

        .scan-header h1 {
            font-size: 20px; font-weight: 600; margin: 0 0 6px 0;
            letter-spacing: -0.02em; color: var(--text-primary);
        }

        .scan-header p {
            color: var(--text-muted); font-size: 14px; margin: 0;
        }

        /* Minimal Corner-Bracket Viewfinder */
        .scanner-frame-box {
            position: relative;
            width: 260px; height: 260px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        #scanner-video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .viewfinder-corners {
            position: absolute;
            width: 180px; height: 180px;
            pointer-events: none;
            border: 2px solid transparent;
            box-sizing: border-box;
        }
        
        .viewfinder-corners::before,
        .viewfinder-corners::after {
            content: ''; position: absolute; width: 24px; height: 24px;
            border-color: #ffffff; border-style: solid;
        }
        .viewfinder-corners::before { top: 0; left: 0; border-width: 2.5px 0 0 2.5px; border-top-left-radius: 8px; }
        .viewfinder-corners::after { bottom: 0; right: 0; border-width: 0 2.5px 2.5px 0; border-bottom-right-radius: 8px; }

        .scan-footer {
            width: 100%; max-width: 320px;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }

        #scan-status {
            font-size: 13px; color: var(--text-muted);
            text-align: center; min-height: 18px;
        }

        .btn-primary {
            width: 100%; padding: 14px 20px;
            border-radius: 12px; border: none;
            background: var(--text-primary); color: #090a0f;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary:active {
            transform: scale(0.98); opacity: 0.9;
        }

        .btn-secondary {
            background: transparent; color: var(--text-muted); border: none;
            font-size: 13px; font-weight: 500; cursor: pointer;
            padding: 8px;
        }

        /* 2. MINIMAL AR OVERLAY */
        #mobile-ar-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box; padding: 20px 16px;
            z-index: 10000;
        }

        .ar-status-pill {
            align-self: center;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            padding: 8px 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 500;
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--success);
        }

        .ar-control-bar {
            display: flex; gap: 10px; pointer-events: auto; width: 100%;
        }

        .ar-btn {
            flex: 1; padding: 14px 12px; border-radius: 14px;
            border: 1px solid var(--border-glass);
            background: var(--bg-glass);
            color: var(--text-primary);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 13px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            transition: all 0.15s ease;
        }

        .ar-btn:active {
            transform: scale(0.97);
        }

        #btn-hardware-toggle {
            background: var(--text-primary);
            color: #090a0f;
            border: none;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important;">

    <!-- 1. MINIMAL SCANNER MODAL -->
    <div id="door-scan-screen">
        <div class="scan-header">
            <h1>Noemata Vision</h1>
            <p>Scan doorway code to align room coordinate map</p>
        </div>

        <div class="scanner-frame-box">
            <video id="scanner-video" playsinline muted autoplay></video>
            <div class="viewfinder-corners"></div>
        </div>

        <div class="scan-footer">
            <div id="scan-status">Searching for origin datum...</div>
            <button class="btn-primary" id="btn-enter-ar" style="display: none;">Enter Workspace AR</button>
            <button class="btn-secondary" id="btn-manual-launch">Skip calibration</button>
        </div>
    </div>

    <!-- 2. STAGNANT GLASS OVERLAY -->
    <div id="mobile-ar-overlay" style="display: none;">
        <div class="ar-status-pill">
            <div class="status-dot"></div>
            <span id="overlay-sync-state">Live Telemetry Synchronized</span>
        </div>

        <div class="ar-control-bar">
            <button class="ar-btn" id="btn-resync">Re-Center Origin</button>
            <button class="ar-btn" id="btn-hardware-toggle">Power: Toggle</button>
        </div>
    </div>

    <script>
        // Force WebGL Canvas Transparency for AR Passthrough
        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // Smooth Billboard Component
        AFRAME.registerComponent('billboard', {
            tick: function () {
                const cam = document.getElementById('main-camera');
                if (!cam) return;
                const nodePos = this.el.object3D.position;
                const camPos = cam.object3D.position;
                const angleY = Math.atan2(camPos.x - nodePos.x, camPos.z - nodePos.z);
                this.el.object3D.rotation.y = angleY;
            }
        });

        // Hover Raycaster Component
        AFRAME.registerComponent('gaze-hud-manager', {
            init: function () {
                this.el.addEventListener('raycaster-intersected', () => {
                    const card = this.el.parentElement.querySelector('.info-card');
                    if (card) card.setAttribute('visible', 'true');
                });
                this.el.addEventListener('raycaster-intersected-cleared', () => {
                    const card = this.el.parentElement.querySelector('.info-card');
                    if (card) card.setAttribute('visible', 'false');
                });
            }
        });
    </script>

    <!-- Native A-Frame Scene with Minimalist 3D HUD Cards -->
    <a-scene force-passthrough
             webxr="requiredFeatures: local-floor; optionalFeatures: dom-overlay; overlayElement: #mobile-ar-overlay; referenceSpaceType: local-floor;"
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">

        <!-- Camera Rig & Subtle Dot Pointer -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity cursor="fuse: false;"
                          raycaster="objects: .gaze-target; far: 8;"
                          position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.003; radiusOuter: 0.006"
                          material="color: #ffffff; shader: flat; opacity: 0.6; depthTest: false;">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

        <!-- MASTER WORLD ZERO CONTAINER -->
        <a-entity id="noemata-spatial-anchor" position="0 0 0">

            <!-- 1. CLIMATE SENSOR -->
            <a-entity id="smart-climate-asset" position="-0.868 1.4 -1.2" billboard>
                <a-box class="gaze-target" gaze-hud-manager width="0.14" height="0.14" depth="0.14" material="color: #38bdf8; shader: flat; opacity: 0.85; depthTest: false;"></a-box>
                <a-text value="Climate Sensor" position="0 0.16 0" width="1.2" align="center" color="#ffffff" font="roboto"></a-text>

                <a-entity class="info-card" position="0 0.42 0" visible="false">
                    <a-plane width="0.65" height="0.30" color="#111827" opacity="0.9" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-climate-status" value="STATUS: OPTIMAL" color="#34d399" width="0.95" position="-0.28 0.07 0.01" font="roboto"></a-text>
                    <a-text id="popup-climate-temp" value="-- °F  ·  --% RH" color="#f9fafb" width="0.9" position="-0.28 -0.04 0.01" font="roboto"></a-text>
                </a-entity>
            </a-entity>

            <!-- 2. PERIMETER GUARD -->
            <a-entity id="perimeter-monitor-asset" position="1.051 1.4 -1.8" billboard>
                <a-cylinder class="gaze-target" gaze-hud-manager radius="0.08" height="0.16" material="color: #60a5fa; shader: flat; opacity: 0.85; depthTest: false;"></a-cylinder>
                <a-text value="Perimeter Monitor" position="0 0.16 0" width="1.2" align="center" color="#ffffff" font="roboto"></a-text>

                <a-entity class="info-card" position="0 0.42 0" visible="false">
                    <a-plane width="0.65" height="0.30" color="#111827" opacity="0.9" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-perimeter-status" value="SHIELD: SECURE" color="#34d399" width="0.95" position="-0.28 0.07 0.01" font="roboto"></a-text>
                    <a-text id="popup-perimeter-breach" value="0 Breaches Logged" color="#9ca3af" width="0.85" position="-0.28 -0.04 0.01" font="roboto"></a-text>
                </a-entity>
            </a-entity>

            <!-- 3. POWER RELAY -->
            <a-entity id="smart-relay-asset" position="1.716 1.4 -1.5" billboard>
                <a-box id="relay-3d-box" class="gaze-target" gaze-hud-manager width="0.14" height="0.14" depth="0.14" material="color: #94a3b8; shader: flat; opacity: 0.85; depthTest: false;"></a-box>
                <a-text value="Power Relay" position="0 0.16 0" width="1.2" align="center" color="#ffffff" font="roboto"></a-text>

                <a-entity class="info-card" position="0 0.42 0" visible="false">
                    <a-plane width="0.65" height="0.30" color="#111827" opacity="0.9" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="popup-relay-status" value="RELAY: OFF" color="#9ca3af" width="0.95" position="-0.28 0.07 0.01" font="roboto"></a-text>
                    <a-text id="popup-relay-power" value="0.0 kW Load" color="#f9fafb" width="0.85" position="-0.28 -0.04 0.01" font="roboto"></a-text>
                </a-entity>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        function applyDynamicPositions(map) {
            if (!map) return;
            const targets = [
                { key: 'smart_climate_node', elementId: 'smart-climate-asset' },
                { key: 'perimeter_monitor', elementId: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', elementId: 'smart-relay-asset' }
            ];

            targets.forEach(item => {
                const data = map[item.key];
                const el = document.getElementById(item.elementId);
                if (data && el && data.x !== undefined) {
                    const posY = parseFloat(data.y) < 0 ? (1.4 + parseFloat(data.y)).toFixed(3) : data.y;
                    el.setAttribute('position', `${data.x} ${posY} ${data.z}`);
                }
            });
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => applyDynamicPositions(db.anchors || db));

        socket.on('spatialAnchorsUpdated', (anchors) => applyDynamicPositions(anchors));

        // Scanner Handlers
        const videoEl = document.getElementById('scanner-video');
        const scanStatus = document.getElementById('scan-status');
        const enterArBtn = document.getElementById('btn-enter-ar');
        const doorScanScreen = document.getElementById('door-scan-screen');
        const arOverlay = document.getElementById('mobile-ar-overlay');
        let cameraStream = null;
        let scanInterval = null;

        async function initDoorframeCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                videoEl.srcObject = cameraStream;
                startQRInspection();
            } catch (err) {
                scanStatus.innerText = "Camera unavailable";
                enterArBtn.style.display = 'block';
            }
        }

        function startQRInspection() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            scanInterval = setInterval(() => {
                if (videoEl.readyState === videoEl.HAVE_ENOUGH_DATA) {
                    canvas.width = videoEl.videoWidth;
                    canvas.height = videoEl.videoHeight;
                    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    const code = jsQR(imgData.data, imgData.width, imgData.height);
                    if (code && (code.data.includes("doorframe") || code.data.includes("noemata"))) {
                        clearInterval(scanInterval);
                        scanStatus.innerText = "Origin code matched";
                        scanStatus.style.color = "#10b981";
                        enterArBtn.style.display = 'block';
                    }
                }
            }, 120);
        }

        function stopPreArCamera() {
            clearInterval(scanInterval);
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            if (videoEl.srcObject) {
                videoEl.srcObject = null;
            }
        }

        function triggerEnterAR() {
            stopPreArCamera();
            doorScanScreen.style.display = 'none';
            arOverlay.style.display = 'flex';

            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.enterAR) {
                sceneEl.enterAR();
            } else if (sceneEl.enterVR) {
                sceneEl.enterVR();
            }

            setTimeout(() => {
                const cameraEl = document.getElementById('main-camera');
                const spatialAnchor = document.getElementById('noemata-spatial-anchor');
                if (cameraEl && spatialAnchor) {
                    const camPos = cameraEl.object3D.position;
                    const camRot = cameraEl.object3D.rotation;
                    spatialAnchor.object3D.position.set(camPos.x, 0, camPos.z);
                    spatialAnchor.object3D.rotation.set(0, camRot.y, 0);
                }
            }, 300);
        }

        enterArBtn.addEventListener('click', triggerEnterAR);
        document.getElementById('btn-manual-launch').addEventListener('click', triggerEnterAR);

        document.getElementById('btn-resync').addEventListener('click', (e) => {
            e.stopPropagation();
            const cameraEl = document.getElementById('main-camera');
            const spatialAnchor = document.getElementById('noemata-spatial-anchor');
            if (cameraEl && spatialAnchor) {
                const camPos = cameraEl.object3D.position;
                const camRot = cameraEl.object3D.rotation;
                spatialAnchor.object3D.position.set(camPos.x, 0, camPos.z);
                spatialAnchor.object3D.rotation.set(0, camRot.y, 0);
            }
        });

        document.getElementById('btn-hardware-toggle').addEventListener('click', (e) => {
            e.stopPropagation();
            fetch('/api/hardware/relay/toggle', { method: 'POST' })
                .catch(err => console.error("Toggle failed:", err));
        });

        // Socket Telemetry Listeners
        socket.on('climateStateUpdate', (data) => {
            const tempText = document.getElementById('popup-climate-temp');
            const statusText = document.getElementById('popup-climate-status');
            const climateBox = document.querySelector('#smart-climate-asset a-box');

            if (tempText && statusText) {
                tempText.setAttribute('value', `${data.temperature} °F  ·  ${data.humidity}% RH`);
                statusText.setAttribute('value', `STATUS: ${data.status}`);

                const isWarning = data.status === "OVERHEATING_WARNING";
                const activeColor = isWarning ? "#ef4444" : "#10b981";
                statusText.setAttribute('color', activeColor);
                if (climateBox) climateBox.setAttribute('material', 'color', isWarning ? "#ef4444" : "#38bdf8");
            }
        });

        socket.on('twinStateUpdate', (state) => {
            if (state.perimeter_monitor) {
                const pStatus = document.getElementById('popup-perimeter-status');
                const pBreach = document.getElementById('popup-perimeter-breach');
                const pCylinder = document.querySelector('#perimeter-monitor-asset a-cylinder');

                const isBreached = state.perimeter_monitor.perimeter === "BREACH_ALERT";
                const pColor = isBreached ? "#ef4444" : "#10b981";

                if (pStatus) {
                    pStatus.setAttribute('value', `SHIELD: ${state.perimeter_monitor.perimeter}`);
                    pStatus.setAttribute('color', pColor);
                }
                if (pBreach) pBreach.setAttribute('value', `${state.perimeter_monitor.breachCount} Breaches Logged`);
                if (pCylinder) pCylinder.setAttribute('material', 'color', isBreached ? "#ef4444" : "#60a5fa");
            }

            if (state.smart_power_relay) {
                const rStatus = document.getElementById('popup-relay-status');
                const rPower = document.getElementById('popup-relay-power');
                const rBox = document.getElementById('relay-3d-box');
                const toggleBtn = document.getElementById('btn-hardware-toggle');

                const isRelayOn = state.smart_power_relay.status === "ON";

                if (rStatus) {
                    rStatus.setAttribute('value', `RELAY: ${state.smart_power_relay.status}`);
                    rStatus.setAttribute('color', isRelayOn ? "#10b981" : "#9ca3af");
                }
                if (rPower) rPower.setAttribute('value', `${state.smart_power_relay.powerDraw} kW Load`);
                if (rBox) rBox.setAttribute('material', 'color', isRelayOn ? "#38bdf8" : "#94a3b8");
                if (toggleBtn) {
                    toggleBtn.innerText = `Power: ${state.smart_power_relay.status}`;
                    toggleBtn.style.background = isRelayOn ? "#ef4444" : "#ffffff";
                    toggleBtn.style.color = isRelayOn ? "#ffffff" : "#090a0f";
                }
            }
        });

        window.addEventListener('DOMContentLoaded', initDoorframeCamera);
    </script>
</body>
</html>
