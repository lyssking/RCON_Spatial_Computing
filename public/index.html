<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL AR VIEWER</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 99999;
            padding: 16px 28px; background: #00f0ff; color: #000;
            border: none; border-radius: 8px; font-family: monospace;
            font-weight: bold; font-size: 18px; cursor: pointer;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important;">

    <button id="custom-ar-btn">ENTER AR VIEWER</button>

    <script>
        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) scene.renderer.setClearColor(0x000000, 0);
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test, local-floor, anchors; referenceSpaceType: local-floor;"
             force-passthrough
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">
        
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity id="hud-pointer"
                          raycaster="objects: .gaze-target; far: 10;"
                          cursor="fuse: false;" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                          material="color: #00f0ff; shader: flat; opacity: 0.8;">
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- 1. SMART CLIMATE NODE -->
        <a-entity class="gaze-target" id="smart-climate-asset" position="0 1.4 -1.2">
            <a-box width="0.2" height="0.2" depth="0.2" material="color: #00f0ff; shader: flat; wireframe: true;"></a-box>
            <a-text value="[ CLIMATE NODE ]" position="0 0.22 0" width="1.4" align="center" color="#00f0ff" font="monoid"></a-text>

            <a-entity class="info-card" position="0 0.38 0" visible="false" scale="0.001 0.001 0.001">
                <a-plane width="0.7" height="0.32" color="#121620" opacity="0.95" material="shader: flat;"></a-plane>
                <a-text id="popup-climate-status" value="CLIMATE: OPTIMAL" color="#00f0ff" width="1.2" position="-0.3 0.08 0.01" font="monoid"></a-text>
                <a-text id="popup-climate-temp" value="TEMP: -- °F | HUM: --%" color="#ffffff" width="1.0" position="-0.3 -0.04 0.01" font="monoid"></a-text>
            </a-entity>
        </a-entity>

        <!-- 2. PERIMETER MONITOR -->
        <a-entity class="gaze-target" id="perimeter-monitor-asset" position="-0.6 1.4 -1.5">
            <a-cylinder radius="0.15" height="0.22" material="color: #00f0ff; shader: flat; wireframe: true;"></a-cylinder>
            <a-text value="[ PERIMETER GUARD ]" position="0 0.24 0" width="1.4" align="center" color="#64748b" font="monoid"></a-text>

            <a-entity class="info-card" position="0 0.38 0" visible="false" scale="0.001 0.001 0.001">
                <a-plane width="0.65" height="0.3" color="#121620" opacity="0.95" material="shader: flat;"></a-plane>
                <a-text id="popup-perimeter-status" value="SHIELD: SECURE" color="#00f0ff" width="1.1" position="-0.27 0.07 0.01" font="monoid"></a-text>
                <a-text id="popup-perimeter-breach" value="BREACHES: 0" color="#ff0055" width="0.9" position="-0.27 -0.04 0.01" font="monoid"></a-text>
            </a-entity>
        </a-entity>

        <!-- 3. SMART POWER RELAY -->
        <a-entity class="gaze-target" id="smart-relay-asset" position="0.6 1.4 -1.5">
            <a-box width="0.18" height="0.18" depth="0.18" material="color: #64748b; shader: flat; wireframe: true;"></a-box>
            <a-text value="[ POWER RELAY ]" position="0 0.22 0" width="1.4" align="center" color="#64748b" font="monoid"></a-text>

            <a-entity class="info-card" position="0 0.38 0" visible="false" scale="0.001 0.001 0.001">
                <a-plane width="0.65" height="0.3" color="#121620" opacity="0.95" material="shader: flat;"></a-plane>
                <a-text id="popup-relay-status" value="RELAY: OFF" color="#ffffff" width="1.1" position="-0.27 0.07 0.01" font="monoid"></a-text>
                <a-text id="popup-relay-power" value="LOAD: 0.0 kW" color="#64748b" width="0.9" position="-0.27 -0.04 0.01" font="monoid"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        const sceneEl = document.querySelector('a-scene');

        async function restorePersistentAnchors(dbMap) {
            const session = sceneEl.xrSession;

            const targets = [
                { key: 'smart_climate_node', elementId: 'smart-climate-asset' },
                { key: 'perimeter_monitor', elementId: 'perimeter-monitor-asset' },
                { key: 'smart_power_relay', elementId: 'smart-relay-asset' }
            ];

            for (const item of targets) {
                const data = dbMap[item.key];
                const el = document.getElementById(item.elementId);

                if (data && el) {
                    let restored = false;

                    // 1. Attempt Quest Hardware Spatial Anchor Restoration
                    if (session && data.anchorUUID && session.restorePersistentAnchor) {
                        try {
                            const anchor = await session.restorePersistentAnchor(data.anchorUUID);
                            if (anchor) {
                                restored = true;
                                console.log(`[HARDWARE ANCHOR RESTORED] ${item.key}`);
                            }
                        } catch (err) {
                            console.warn(`[ANCHOR RESTORE FALLBACK] ${item.key}:`, err);
                        }
                    }

                    // 2. Fallback to coordinate position
                    if (!restored && data.x !== undefined) {
                        el.setAttribute('position', `${data.x} ${data.y} ${data.z}`);
                    }
                }
            }
        }

        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => {
                const map = db.anchors || db;
                sceneEl.addEventListener('enter-vr', () => restorePersistentAnchors(map));
                restorePersistentAnchors(map);
            });

        socket.on('spatialAnchorsUpdated', (anchors) => restorePersistentAnchors(anchors));

        // Hover gaze interaction
        document.querySelectorAll('.gaze-target').forEach(el => {
            const card = el.querySelector('.info-card');
            el.addEventListener('raycaster-intersected', () => {
                if (card) {
                    card.setAttribute('visible', 'true');
                    card.setAttribute('scale', '1 1 1');
                }
            });
            el.addEventListener('raycaster-intersected-cleared', () => {
                if (card) {
                    card.setAttribute('visible', 'false');
                    card.setAttribute('scale', '0.001 0.001 0.001');
                }
            });
        });

        // Socket telemetry
        socket.on('climateStateUpdate', (data) => {
            const tempText = document.getElementById('popup-climate-temp');
            const statusText = document.getElementById('popup-climate-status');
            if (tempText && statusText) {
                tempText.setAttribute('value', `TEMP: ${data.temperature} °F | HUM: ${data.humidity}%`);
                statusText.setAttribute('value', `CLIMATE: ${data.status}`);
            }
        });

        socket.on('twinStateUpdate', (state) => {
            if (state.perimeter_monitor) {
                const pStatus = document.getElementById('popup-perimeter-status');
                const pBreach = document.getElementById('popup-perimeter-breach');
                if (pStatus) pStatus.setAttribute('value', `SHIELD: ${state.perimeter_monitor.perimeter}`);
                if (pBreach) pBreach.setAttribute('value', `BREACHES: ${state.perimeter_monitor.breachCount}`);
            }
            if (state.smart_power_relay) {
                const rStatus = document.getElementById('popup-relay-status');
                const rPower = document.getElementById('popup-relay-power');
                if (rStatus) rStatus.setAttribute('value', `RELAY: ${state.smart_power_relay.status}`);
                if (rPower) rPower.setAttribute('value', `LOAD: ${state.smart_power_relay.powerDraw} kW`);
            }
        });

        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            if (sceneEl.enterAR) sceneEl.enterAR();
            else sceneEl.enterVR();
            document.getElementById('custom-ar-btn').style.display = 'none';
        });
    </script>
</body>
</html>
