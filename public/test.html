<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NOEMATA // PASSTHROUGH TEST</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <a-scene webxr="optionalFeatures: hit-test, local-floor;"
             background="transparent: true"
             renderer="alpha: true; colorManagement: true;"
             xr-mode-ui="mode: ar">
        
        <!-- Cyan floating box 1 meter in front of camera -->
        <a-box position="0 1.5 -1" rotation="0 45 0" color="#00f0ff"></a-box>
        
        <!-- Light source -->
        <a-light type="ambient" color="#ffffff"></a-light>
    </a-scene>

</body>
</html>
