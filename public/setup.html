<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noemata // Quest Surface Mapper</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>

    <script>
        AFRAME.registerComponent('quest-surface-hittest', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.reticle = document.getElementById('surface-reticle');
                this.originFloor = { x: 0, z: 0 };
                window.isLocked = false;
                window.latestHitPos = null;
                window.isHoveringUI = false;

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    // Request 6DoF Viewer Raycast Source
                    session.requestReferenceSpace('viewer').then((vSpace) => {
                        this.viewerSpace = vSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.error('HitTest source error:', e));
                    });

                    session.requestReferenceSpace('local-floor').catch(() => {
                        return session.requestReferenceSpace('local');
                    }).then((refSpace) => {
                        this.refSpace = refSpace;
                    });

                    // Pulling Controller Trigger locks surface position
                    session.addEventListener('select', () => {
                        if (!window.isHoveringUI && window.latestHitPos && !window.isLocked) {
                            window.isLocked = true;
                            
                            window.calculatedCoords = {
                                x: parseFloat((window.latestHitPos.x - this.originFloor.x).toFixed(2)),
                                y: parseFloat(window.latestHitPos.y.toFixed(2)),
                                z: parseFloat((window.latestHitPos.z - this.originFloor.z).toFixed(2))
                            };

                            const reticleSphere = document.querySelector('#surface-reticle a-sphere');
                            const txtSave = document.getElementById('txt-save');
                            const btnSave = document.getElementById('btn-save');

                            if (reticleSphere) reticleSphere.setAttribute('color', '#ef4444');
                            if (txtSave) txtSave.setAttribute('value', 'SAVE SURFACE PIN');
                            if (btnSave) btnSave.setAttribute('color', '#10b981');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    const pose = hitTestResults[0].getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        // Stick reticle directly onto real physical surface
                        this.reticle.object3D.position.set(p.x, p.y, p.z);
                        this.reticle.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.reticle.setAttribute('visible', 'true');

                        window.latestHitPos = { x: p.x, y: p.y, z: p.z };

                        const coords = {
                            x: parseFloat((p.x - this.originFloor.x).toFixed(2)),
                            y: parseFloat(p.y.toFixed(2)),
                            z: parseFloat((p.z - this.originFloor.z).toFixed(2))
                        };

                        const readout = document.getElementById('hud-coords');
                        if (readout) {
                            readout.setAttribute('value', `SURFACE: X:${coords.x}m Y:${coords.y}m Z:${coords.z}m`);
                        }
                    }
                }
            }
        });
    </script>

    <!-- Scene with Native AR Button & WebXR Hit-Testing -->
    <a-scene quest-surface-hittest
             webxr="requiredFeatures: hit-test, local-floor;"
             renderer="colorManagement: true; antialias: true;"
             vr-mode-ui="enabled: true">
        
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .ui-btn; far: 8;"></a-entity>
        <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .ui-btn; far: 8;"></a-entity>

        <!-- FLOATING CONTROL TERMINAL -->
        <a-entity id="hud-panel" position="0 1.35 -1.2">
            <a-plane width="1.45" height="0.85" color="#0f172a" opacity="0.95"></a-plane>

            <a-text id="hud-title" value="TARGET: SMART CLIMATE NODE" color="#38bdf8" align="center" width="1.8" position="0 0.30 0.01" font="roboto"></a-text>
            <a-text id="hud-coords" value="AIM AT CEILING / WALL SURFACE" color="#34d399" align="center" width="1.3" position="0 0.16 0.01" font="roboto"></a-text>

            <!-- 1. Origin Set Button -->
            <a-plane class="ui-btn" id="btn-origin" width="1.2" height="0.11" color="#e11d48" position="0 0.02 0.02">
                <a-text id="txt-origin" value="[ 1. STAND AT DOOR & SET FLOOR ORIGIN ]" color="#ffffff" width="1.1" align="center" position="0 0 0.01" font="roboto"></a-text>
            </a-plane>

            <!-- Switch & Save Actions -->
            <a-plane class="ui-btn" id="btn-next" width="0.55" height="0.12" color="#1e293b" position="-0.33 -0.20 0.02">
                <a-text value="NEXT DEVICE" color="#38bdf8" width="1.1" align="center" position="0 0 0.01" font="roboto"></a-text>
            </a-plane>
            <a-plane class="ui-btn" id="btn-save" width="0.55" height="0.12" color="#334155" position="0.33 -0.20 0.02">
                <a-text id="txt-save" value="[ TRIGGER TO LOCK ]" color="#94a3b8" width="1.0" align="center" position="0 0 0.01" font="roboto"></a-text>
            </a-plane>
        </a-entity>

        <!-- SURFACE-ALIGNED RETICLE -->
        <a-entity id="surface-reticle" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.12" color="#34d399" rotation="-90 0 0"></a-ring>
            <a-sphere radius="0.04" color="#38bdf8" position="0 0 0"></a-sphere>
            <a-box width="0.14" height="0.14" depth="0.14" material="wireframe: true; color: #34d399;" position="0 0.07 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentIdx = 0;

        const hudTitle = document.getElementById('hud-title');
        const btnOrigin = document.getElementById('btn-origin');
        const txtOrigin = document.getElementById('txt-origin');
        const btnNext = document.getElementById('btn-next');
        const btnSave = document.getElementById('btn-save');
        const txtSave = document.getElementById('txt-save');

        // Track UI raycasting so clicking UI buttons doesn't trigger surface lock
        document.querySelectorAll('.ui-btn').forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringUI = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringUI = false; });
        });

        // 1. Set Doorway Floor Origin
        btnOrigin.addEventListener('click', () => {
            const cam = document.getElementById('main-camera');
            const mapper = document.querySelector('a-scene').components['quest-surface-hittest'];
            if (cam && mapper) {
                mapper.originFloor = { x: cam.object3D.position.x, z: cam.object3D.position.z };
                btnOrigin.setAttribute('color', '#10b981');
                txtOrigin.setAttribute('value', 'FLOOR ORIGIN SET');
            }
        });

        // 2. Next Device
        btnNext.addEventListener('click', () => {
            currentIdx = (currentIdx + 1) % devices.length;
            hudTitle.setAttribute('value', devices[currentIdx].label);
            resetLock();
        });

        // 3. Save Anchored Position
        btnSave.addEventListener('click', () => {
            if (!window.calculatedCoords) return;
            const activeKey = devices[currentIdx].key;

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: activeKey, position: window.calculatedCoords })
            })
            .then(res => res.json())
            .then(() => {
                txtSave.setAttribute('value', 'PIN SAVED!');
                btnSave.setAttribute('color', '#2563eb');
                setTimeout(resetLock, 1500);
            });
        });

        function resetLock() {
            window.isLocked = false;
            const reticleSphere = document.querySelector('#surface-reticle a-sphere');
            if (reticleSphere) reticleSphere.setAttribute('color', '#38bdf8');
            btnSave.setAttribute('color', '#334155');
            txtSave.setAttribute('value', '[ TRIGGER TO LOCK ]');
        }
    </script>
</body>
</html>
