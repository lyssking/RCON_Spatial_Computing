<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // PERSISTENT ANCHOR SETUP</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute; bottom: 25px; right: 25px; z-index: 99999;
            padding: 16px 28px; background: #00f0ff; color: #000;
            border: none; border-radius: 8px; font-family: monospace;
            font-weight: bold; font-size: 18px; cursor: pointer;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <button id="custom-ar-btn">ENTER AR SETUP</button>

    <script>
        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) scene.renderer.setClearColor(0x000000, 0);
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        AFRAME.registerComponent('persistent-anchor-creator', {
            init: function () {
                this.hitTestSource = null;
                this.refSpace = null;
                this.lastHitResult = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    session.requestReferenceSpace('viewer').then(viewerSpace => {
                        session.requestHitTestSource({ space: viewerSpace }).then(source => {
                            this.hitTestSource = source;
                        });
                    });

                    session.requestReferenceSpace('local-floor').then(refSpace => {
                        this.refSpace = refSpace;
                    });

                    // Trigger click locks hit-test surface
                    session.addEventListener('select', async (evt) => {
                        if (window.isHoveringButton || !this.lastHitResult) return;

                        const hit = this.lastHitResult;
                        const statusLabel = document.getElementById('hud-status-label');

                        if (hit.createAnchor && session.requestPersistentHandle) {
                            try {
                                statusLabel.setAttribute('value', 'CREATING HARDWARE ANCHOR...');
                                
                                // 1. Create WebXR Anchor attached to real surface
                                const anchor = await hit.createAnchor();
                                
                                // 2. Convert anchor into persistent system handle (UUID)
                                const anchorUUID = await session.requestPersistentHandle(anchor);

                                window.currentAnchorUUID = anchorUUID;
                                window.lockedCoords = window.latestHitPos;

                                statusLabel.setAttribute('value', 'ANCHOR LOCKED! CLICK CREATE NOW.');
                                statusLabel.setAttribute('color', '#39ff14');
                            } catch (err) {
                                console.error('Anchor Creation Error:', err);
                                statusLabel.setAttribute('value', 'FALLBACK TO LOCAL COORDS');
                                window.lockedCoords = window.latestHitPos;
                            }
                        } else {
                            window.lockedCoords = window.latestHitPos;
                            statusLabel.setAttribute('value', 'COORDS LOCKED! CLICK CREATE NOW.');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.hitTestSource || !this.refSpace || window.currentAnchorUUID) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const results = frame.getHitTestResults(this.hitTestSource);
                if (results.length > 0) {
                    this.lastHitResult = results[0];
                    const pose = this.lastHitResult.getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        this.previewEl.object3D.position.set(p.x, p.y, p.z);
                        this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.previewEl.setAttribute('visible', 'true');

                        window.latestHitPos = { x: p.x.toFixed(3), y: p.y.toFixed(3), z: p.z.toFixed(3) };
                    }
                }
            }
        });
    </script>

    <!-- ENABLE WEBXR ANCHORS & PERSISTENT ANCHORS MODULE -->
    <a-scene webxr="requiredFeatures: hit-test, local-floor, anchors; referenceSpaceType: local-floor;"
             force-ar-passthrough
             persistent-anchor-creator
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">
        
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <a-entity laser-controls="hand: left" raycaster="objects: .ui-button; far: 5;"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .ui-button; far: 5;"></a-entity>

        <!-- FLOATING CONTROL TERMINAL -->
        <a-entity id="world-terminal" position="0 1.4 -1.5">
            <a-plane width="1.4" height="0.75" color="#0d1117" opacity="0.92" material="shader: flat;"></a-plane>
            <a-plane width="1.44" height="0.79" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat;"></a-plane>

            <a-text id="hud-device-label" value="TARGET: SMART CLIMATE NODE" color="#00f0ff" align="center" width="2.0" position="0 0.24 0.02" font="monoid"></a-text>
            <a-text id="hud-status-label" value="AIM AT HARDWARE NODE & PULL TRIGGER" color="#94a3b8" align="center" width="1.5" position="0 0.08 0.02" font="monoid"></a-text>

            <a-plane class="ui-button" id="btn-toggle-device" width="0.55" height="0.16" color="#1e293b" position="-0.35 -0.18 0.03" material="shader: flat;">
                <a-text value="[ NEXT DEVICE ]" color="#00f0ff" width="1.3" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <a-plane class="ui-button" id="btn-save-device" width="0.55" height="0.16" color="#334155" position="0.35 -0.18 0.03" material="shader: flat;">
                <a-text value="[ CREATE ANCHOR ]" color="#94a3b8" width="1.3" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.1" color="#39ff14" rotation="-90 0 0" material="shader: flat;"></a-ring>
            <a-box size="0.12" material="color: #39ff14; wireframe: true;" position="0 0.06 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        window.latestHitPos = null;
        window.lockedCoords = null;
        window.currentAnchorUUID = null;
        window.isHoveringButton = false;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');

        [toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringButton = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringButton = false; });
        });

        toggleBtn.addEventListener('click', () => {
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            window.currentAnchorUUID = null;
            window.lockedCoords = null;
            statusLabel.setAttribute('value', 'AIM AT HARDWARE NODE & PULL TRIGGER');
        });

        saveBtn.addEventListener('click', async () => {
            if (!window.lockedCoords) return;

            const activeKey = devices[currentDeviceIndex].key;
            statusLabel.setAttribute('value', 'PERSISTING ANCHOR TO RENDER...');

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    deviceId: activeKey,
                    position: window.lockedCoords,
                    anchorUUID: window.currentAnchorUUID
                })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `HARDWARE ANCHOR SAVED!`);
                statusLabel.setAttribute('color', '#39ff14');
            });
        });

        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.enterAR) sceneEl.enterAR();
            else sceneEl.enterVR();
            document.getElementById('custom-ar-btn').style.display = 'none';
        });
    </script>
</body>
</html>
