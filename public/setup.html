<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // QUEST SPATIAL MAPPER</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 99999;
            padding: 18px 36px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <button id="custom-ar-btn">ENTER QUEST PASSTHROUGH MAPPER</button>

    <script>
        // Force Canvas Transparency for Quest Passthrough
        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // 6DoF Quest Controller Surface Snapping Component
        AFRAME.registerComponent('quest-spatial-manager', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        this.viewerSpace = refSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.log('Hit-test source error:', e));
                    }).catch(e => console.log('Viewer space error:', e));

                    session.requestReferenceSpace('local-floor').catch(() => {
                        return session.requestReferenceSpace('local');
                    }).then((refSpace) => {
                        this.refSpace = refSpace;
                    });

                    // Pull trigger on Quest controller to lock target reticle
                    session.addEventListener('select', () => {
                        if (!window.isHoveringButton && window.latestHitPos && !window.isPosLocked) {
                            window.isPosLocked = true;
                            window.lockedCoords = { ...window.latestHitPos };

                            const statusLabel = document.getElementById('hud-status-label');
                            const saveBtn = document.getElementById('btn-save-device');
                            const saveBtnText = document.getElementById('save-btn-text');

                            if (statusLabel) {
                                statusLabel.setAttribute('value', 'SURFACE LOCKED! CLICK CREATE ANCHOR.');
                                statusLabel.setAttribute('color', '#39ff14');
                            }
                            if (saveBtn) saveBtn.setAttribute('color', '#00f0ff');
                            if (saveBtnText) saveBtnText.setAttribute('color', '#000000');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isPosLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    const pose = hitTestResults[0].getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        this.previewEl.object3D.position.set(p.x, p.y, p.z);
                        this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.previewEl.setAttribute('visible', 'true');

                        window.latestHitPos = { 
                            x: parseFloat(p.x.toFixed(3)), 
                            y: parseFloat(p.y.toFixed(3)), 
                            z: parseFloat(p.z.toFixed(3)) 
                        };
                    }
                }
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: anchors; referenceSpaceType: local-floor;"
             force-ar-passthrough
             quest-spatial-manager
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">
        
        <!-- Camera Rig -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <!-- Quest Left & Right 6DoF Laser Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .ui-button; far: 10;"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .ui-button; far: 10;"></a-entity>

        <!-- FLOATING CYBERNETIC CONTROL PANEL -->
        <a-entity id="world-terminal" position="0 1.4 -1.4">
            <a-plane width="1.3" height="0.7" color="#0d1117" opacity="0.94" material="shader: flat; depthTest: false;"></a-plane>
            <a-plane width="1.34" height="0.74" color="#00f0ff" opacity="0.35" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>

            <a-text id="hud-device-label" 
                    value="TARGET: SMART CLIMATE NODE" 
                    color="#00f0ff" 
                    align="center" 
                    width="1.8" 
                    position="0 0.22 0.01" 
                    font="monoid">
            </a-text>

            <a-text id="hud-status-label" 
                    value="AIM CONTROLLER & SQUEEZE TRIGGER TO LOCK" 
                    color="#94a3b8" 
                    align="center" 
                    width="1.3" 
                    position="0 0.08 0.01" 
                    font="monoid">
            </a-text>

            <!-- Toggle Next Device Button -->
            <a-plane class="ui-button" id="btn-toggle-device" width="0.52" height="0.14" color="#1e293b" position="-0.32 -0.16 0.02" material="shader: flat; depthTest: false;">
                <a-text value="[ NEXT DEVICE ]" color="#00f0ff" width="1.2" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <!-- Save Anchor Button -->
            <a-plane class="ui-button" id="btn-save-device" width="0.52" height="0.14" color="#334155" position="0.32 -0.16 0.02" material="shader: flat; depthTest: false;">
                <a-text id="save-btn-text" value="[ CREATE ANCHOR ]" color="#94a3b8" width="1.2" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <!-- GREEN TARGET RETICLE -->
        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.1" color="#39ff14" rotation="-90 0 0" material="shader: flat; depthTest: false;"></a-ring>
            <a-box width="0.12" height="0.12" depth="0.12" material="color: #39ff14; wireframe: true; depthTest: false;" position="0 0.06 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        window.isPosLocked = false;
        window.latestHitPos = null;
        window.lockedCoords = null;
        window.isHoveringButton = false;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');
        const saveBtnText = document.getElementById('save-btn-text');

        [toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringButton = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringButton = false; });
        });

        toggleBtn.addEventListener('click', () => {
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            resetLock();
        });

        saveBtn.addEventListener('click', async () => {
            if (!window.lockedCoords) return;

            const activeKey = devices[currentDeviceIndex].key;
            statusLabel.setAttribute('value', 'TRANSMITTING COORDS TO RENDER DB...');
            statusLabel.setAttribute('color', '#00f0ff');

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    deviceId: activeKey, 
                    position: window.lockedCoords
                })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `SAVED ${activeKey.toUpperCase()}!`);
                statusLabel.setAttribute('color', '#39ff14');
                setTimeout(() => resetLock(), 1800);
            })
            .catch(err => {
                statusLabel.setAttribute('value', 'ERROR SAVING POSITION');
                statusLabel.setAttribute('color', '#ff0055');
            });
        });

        function resetLock() {
            window.isPosLocked = false;
            window.lockedCoords = null;
            saveBtn.setAttribute('color', '#334155');
            saveBtnText.setAttribute('color', '#94a3b8');
            statusLabel.setAttribute('value', 'AIM CONTROLLER & SQUEEZE TRIGGER TO LOCK');
            statusLabel.setAttribute('color', '#94a3b8');
        }

        // Quest enterAR launcher
        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            const launch = () => {
                if (sceneEl.enterAR) {
                    sceneEl.enterAR();
                } else {
                    sceneEl.enterVR();
                }
                button.style.display = 'none';
            };

            if (sceneEl.hasLoaded) {
                launch();
            } else {
                sceneEl.addEventListener('loaded', launch);
            }
        });
    </script>
</body>
</html>
