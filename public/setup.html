<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL ANCHOR SETUP</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important; background: transparent !important;">

    <script>
        // Force WebXR Passthrough Blend Mode
        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                this.el.addEventListener('render-target-loaded', () => {
                    if (this.el.renderer) {
                        this.el.renderer.setClearColor(0x000000, 0);
                    }
                });
                this.el.addEventListener('enter-vr', () => {
                    if (this.el.renderer) {
                        this.el.renderer.setClearColor(0x000000, 0);
                    }
                });
            }
        });

        // Hit-Testing Component & Controller Trigger Selection
        AFRAME.registerComponent('noemata-spatial-manager', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.lastHitResult = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        this.viewerSpace = refSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.log('Hit-test unavailable:', e));
                    });

                    session.requestReferenceSpace('local-floor').then((refSpace) => {
                        this.refSpace = refSpace;
                    });

                    // LISTEN FOR CONTROLLER TRIGGER TO LOCK SURFACE LOCATION
                    session.addEventListener('select', () => {
                        if (!window.isHoveringButton && window.latestHitPos && !window.isPosLocked) {
                            window.isPosLocked = true;
                            window.lockedCoords = { ...window.latestHitPos };

                            const statusLabel = document.getElementById('hud-status-label');
                            const saveBtn = document.getElementById('btn-save-device');
                            const saveBtnText = document.getElementById('save-btn-text');

                            if (statusLabel) {
                                statusLabel.setAttribute('value', 'SURFACE LOCKED! CLICK ANCHOR NOW.');
                                statusLabel.setAttribute('color', '#39ff14');
                            }
                            if (saveBtn) saveBtn.setAttribute('color', '#00f0ff');
                            if (saveBtnText) saveBtnText.setAttribute('color', '#000000');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isPosLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    this.lastHitResult = hitTestResults[0];
                    const pose = this.lastHitResult.getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        this.previewEl.object3D.position.set(p.x, p.y, p.z);
                        this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.previewEl.setAttribute('visible', 'true');

                        window.latestHitPos = { x: p.x.toFixed(2), y: p.y.toFixed(2), z: p.z.toFixed(2) };
                    }
                }
            }
        });
    </script>

    <!-- Native A-Frame WebXR setup handles the AR/VR entry trigger directly -->
    <a-scene webxr="requiredFeatures: hit-test; optionalFeatures: anchors, unbounded; referenceSpaceType: local-floor;"
             force-passthrough
             noemata-spatial-manager
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: true; mode: ar"
             style="background-color: rgba(0,0,0,0) !important; background: transparent !important;">
        
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <!-- Laser Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .ui-button; far: 5;"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .ui-button; far: 5;"></a-entity>

        <!-- Original HUD UI -->
        <a-entity id="hud-panel" position="0 1.4 -1.2" scale="0.9 0.9 0.9">
            <a-plane width="1.05" height="0.5" color="#121620" opacity="0.95" material="shader:flat; depthTest: false;"></a-plane>
            
            <a-text id="hud-device-label" value="TARGET: SMART CLIMATE NODE" color="#00f0ff" width="1.1" position="-0.48 0.17 0.02" font="monoid"></a-text>
            <a-text id="hud-status-label" value="AIM AT HARDWARE & PULL TRIGGER TO LOCK" color="#64748b" width="0.8" position="-0.48 0.09 0.02" font="monoid"></a-text>

            <a-plane class="ui-button" id="btn-toggle-device" width="0.4" height="0.12" color="#232d3f" position="-0.22 -0.08 0.03" material="shader:flat; depthTest: false;">
                <a-text value="[ NEXT DEVICE ]" color="#00f0ff" width="0.9" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <a-plane class="ui-button" id="btn-save-device" width="0.4" height="0.12" color="#334155" position="0.22 -0.08 0.03" material="shader:flat; depthTest: false;">
                <a-text id="save-btn-text" value="[ CREATE ANCHOR ]" color="#94a3b8" width="0.9" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.1" color="#39ff14" rotation="-90 0 0" material="shader: flat; depthTest: false;"></a-ring>
            <a-box size="0.12" material="color: #39ff14; wireframe: true; depthTest: false;" position="0 0.06 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        window.isPosLocked = false;
        window.latestHitPos = null;
        window.lockedCoords = null;
        window.isHoveringButton = false;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');
        const saveBtnText = document.getElementById('save-btn-text');

        [toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringButton = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringButton = false; });
        });

        toggleBtn.addEventListener('click', () => {
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            resetLock();
        });

        saveBtn.addEventListener('click', async () => {
            if (!window.lockedCoords) return;

            const sceneEl = document.querySelector('a-scene');
            const spatialComp = sceneEl.components['noemata-spatial-manager'];
            const activeKey = devices[currentDeviceIndex].key;

            statusLabel.setAttribute('value', 'LOCKING ANCHOR TO META OS...');
            statusLabel.setAttribute('color', '#00f0ff');

            let anchorUUID = null;

            try {
                if (spatialComp && spatialComp.lastHitResult && spatialComp.lastHitResult.createAnchor) {
                    const anchor = await spatialComp.lastHitResult.createAnchor();
                    if (anchor && anchor.requestPersistentHandle) {
                        anchorUUID = await anchor.requestPersistentHandle();
                    }
                }
            } catch (err) {
                console.warn("[Anchor Persist Warning] Saving raw position fallback:", err);
            }

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    deviceId: activeKey, 
                    position: window.lockedCoords,
                    anchorUUID: anchorUUID 
                })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `SAVED ${activeKey.toUpperCase()} TO META OS!`);
                statusLabel.setAttribute('color', '#39ff14');
                setTimeout(() => resetLock(), 1800);
            });
        });

        function resetLock() {
            window.isPosLocked = false;
            window.lockedCoords = null;
            saveBtn.setAttribute('color', '#334155');
            saveBtnText.setAttribute('color', '#94a3b8');
            statusLabel.setAttribute('value', 'AIM AT HARDWARE & PULL TRIGGER TO LOCK');
            statusLabel.setAttribute('color', '#64748b');
        }
    </script>
</body>
</html>
