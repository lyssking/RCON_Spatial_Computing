<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // QUEST SPATIAL MAPPER</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 99999;
            padding: 18px 36px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <button id="custom-ar-btn">ENTER QUEST PASSTHROUGH MAPPER</button>

    <script>
        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // 6DoF Quest Spatial Hit-Testing & Relative Coordinate Manager
        AFRAME.registerComponent('quest-spatial-manager', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        this.viewerSpace = refSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.log('Hit-test source error:', e));
                    }).catch(e => console.log('Viewer space error:', e));

                    session.requestReferenceSpace('local-floor').catch(() => {
                        return session.requestReferenceSpace('local');
                    }).then((refSpace) => {
                        this.refSpace = refSpace;
                    });

                    // Controller Trigger locks hit position
                    session.addEventListener('select', () => {
                        if (!window.isHoveringButton && window.latestRawHitPos && !window.isPosLocked) {
                            window.isPosLocked = true;

                            // Calculate coordinate relative to doorframe datum
                            window.lockedCoords = window.transformToOrigin(window.latestRawHitPos);

                            const statusLabel = document.getElementById('hud-status-label');
                            const saveBtn = document.getElementById('btn-save-device');
                            const saveBtnText = document.getElementById('save-btn-text');

                            if (statusLabel) {
                                statusLabel.setAttribute('value', `LOCKED: X:${window.lockedCoords.x} Y:${window.lockedCoords.y} Z:${window.lockedCoords.z}`);
                                statusLabel.setAttribute('color', '#39ff14');
                            }
                            if (saveBtn) saveBtn.setAttribute('color', '#00f0ff');
                            if (saveBtnText) saveBtnText.setAttribute('color', '#000000');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isPosLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    const pose = hitTestResults[0].getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        this.previewEl.object3D.position.set(p.x, p.y, p.z);
                        this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.previewEl.setAttribute('visible', 'true');

                        window.latestRawHitPos = { 
                            x: p.x, 
                            y: p.y, 
                            z: p.z 
                        };
                    }
                }
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test, local-floor; referenceSpaceType: local-floor;"
             force-ar-passthrough
             quest-spatial-manager
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">
        
        <!-- Camera Rig -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <!-- Quest Left & Right 6DoF Laser Controllers -->
        <a-entity laser-controls="hand: left" raycaster="objects: .ui-button; far: 10;"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .ui-button; far: 10;"></a-entity>

        <!-- FLOATING CONTROL TERMINAL -->
        <a-entity id="world-terminal" position="0 1.4 -1.4">
            <a-plane width="1.4" height="0.8" color="#0d1117" opacity="0.94" material="shader: flat; depthTest: false;"></a-plane>
            <a-plane width="1.44" height="0.84" color="#00f0ff" opacity="0.35" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>

            <a-text id="hud-device-label" 
                    value="TARGET: SMART CLIMATE NODE" 
                    color="#00f0ff" 
                    align="center" 
                    width="1.8" 
                    position="0 0.28 0.01" 
                    font="monoid">
            </a-text>

            <a-text id="hud-status-label" 
                    value="1. STAND AT DOORWAY & CLICK [SET DOOR ORIGIN]" 
                    color="#94a3b8" 
                    align="center" 
                    width="1.3" 
                    position="0 0.14 0.01" 
                    font="monoid">
            </a-text>

            <!-- Zero Origin at Doorframe Button -->
            <a-plane class="ui-button" id="btn-zero-origin" width="1.1" height="0.12" color="#e11d48" position="0 0.00 0.02" material="shader: flat; depthTest: false;">
                <a-text id="zero-origin-text" value="[ 1. SET DOORWAY ORIGIN HERE ]" color="#ffffff" width="1.2" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <!-- Toggle Next Device Button -->
            <a-plane class="ui-button" id="btn-toggle-device" width="0.52" height="0.14" color="#1e293b" position="-0.32 -0.22 0.02" material="shader: flat; depthTest: false;">
                <a-text value="[ NEXT NODE ]" color="#00f0ff" width="1.2" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <!-- Save Anchor Button -->
            <a-plane class="ui-button" id="btn-save-device" width="0.52" height="0.14" color="#334155" position="0.32 -0.22 0.02" material="shader: flat; depthTest: false;">
                <a-text id="save-btn-text" value="[ SAVE ANCHOR ]" color="#94a3b8" width="1.2" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <!-- GREEN TARGET RETICLE -->
        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.1" color="#39ff14" rotation="-90 0 0" material="shader: flat; depthTest: false;"></a-ring>
            <a-box width="0.12" height="0.12" depth="0.12" material="color: #39ff14; wireframe: true; depthTest: false;" position="0 0.06 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        window.isPosLocked = false;
        window.latestRawHitPos = null;
        window.lockedCoords = null;
        window.isHoveringButton = false;

        window.originOffset = { x: 0, y: 0, z: 0, yaw: 0 };
        window.isOriginSet = false;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const zeroOriginBtn = document.getElementById('btn-zero-origin');
        const zeroOriginText = document.getElementById('zero-origin-text');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');
        const saveBtnText = document.getElementById('save-btn-text');

        [zeroOriginBtn, toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringButton = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringButton = false; });
        });

        // 1. Set Doorframe Origin (True Horizontal Forward Vector)
        zeroOriginBtn.addEventListener('click', () => {
            const cameraEl = document.getElementById('main-camera');
            if (cameraEl) {
                const camObj = cameraEl.object3D;
                
                // Get true horizontal direction without pitch/tilt
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camObj.quaternion);
                const horizontalYaw = Math.atan2(forward.x, forward.z);

                window.originOffset = {
                    x: camObj.position.x,
                    y: camObj.position.y,
                    z: camObj.position.z,
                    yaw: horizontalYaw
                };
                window.isOriginSet = true;

                zeroOriginBtn.setAttribute('color', '#10b981');
                zeroOriginText.setAttribute('value', 'DOOR ORIGIN LOCKED!');
                statusLabel.setAttribute('value', '2. AIM AT HARDWARE & PULL TRIGGER');
                statusLabel.setAttribute('color', '#39ff14');
            }
        });

        // Accurate World -> Relative Door Datum Transform Matrix
        window.transformToOrigin = function(rawPos) {
            if (!window.isOriginSet) {
                return {
                    x: parseFloat(rawPos.x.toFixed(3)),
                    y: parseFloat(rawPos.y.toFixed(3)),
                    z: parseFloat(rawPos.z.toFixed(3))
                };
            }

            const dx = rawPos.x - window.originOffset.x;
            const dy = rawPos.y - window.originOffset.y;
            const dz = rawPos.z - window.originOffset.z;

            const angle = -window.originOffset.yaw;
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);

            const relX = (dx * cos) - (dz * sin);
            const relZ = (dx * sin) + (dz * cos);

            return {
                x: parseFloat(relX.toFixed(3)),
                y: parseFloat(dy.toFixed(3)),
                z: parseFloat(relZ.toFixed(3))
            };
        };

        // 2. Next Device
        toggleBtn.addEventListener('click', () => {
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            resetLock();
        });

        // 3. Save Relative Anchor
        saveBtn.addEventListener('click', async () => {
            if (!window.lockedCoords) return;

            const activeKey = devices[currentDeviceIndex].key;
            statusLabel.setAttribute('value', 'SAVING RELATIVE COORDS TO RENDER...');
            statusLabel.setAttribute('color', '#00f0ff');

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    deviceId: activeKey, 
                    position: window.lockedCoords
                })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `SAVED ${activeKey.toUpperCase()}!`);
                statusLabel.setAttribute('color', '#39ff14');
                setTimeout(() => resetLock(), 1800);
            })
            .catch(err => {
                statusLabel.setAttribute('value', 'ERROR SAVING POSITION');
                statusLabel.setAttribute('color', '#ff0055');
            });
        });

        function resetLock() {
            window.isPosLocked = false;
            window.lockedCoords = null;
            saveBtn.setAttribute('color', '#334155');
            saveBtnText.setAttribute('color', '#94a3b8');
            statusLabel.setAttribute('value', 'AIM AT HARDWARE & PULL TRIGGER');
            statusLabel.setAttribute('color', '#94a3b8');
        }

        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            const launch = () => {
                if (sceneEl.enterAR) {
                    sceneEl.enterAR();
                } else {
                    sceneEl.enterVR();
                }
                button.style.display = 'none';
            };

            if (sceneEl.hasLoaded) {
                launch();
            } else {
                sceneEl.addEventListener('loaded', launch);
            }
        });
    </script>
</body>
</html>
