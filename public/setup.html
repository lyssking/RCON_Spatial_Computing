<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // 3D AR AUTHORING TOOL</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body, .a-canvas {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: transparent !important;
            background: transparent !important;
        }
        #custom-ar-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 99999;
            padding: 18px 32px; background: #00f0ff; color: #000;
            border: none; border-radius: 8px; font-family: monospace;
            font-weight: bold; font-size: 18px; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background-color: transparent !important;">

    <!-- 2D LAUNCH BUTTON (Disappears when entering AR) -->
    <button id="custom-ar-btn">ENTER QUEST PASSTHROUGH AR</button>

    <script>
        // Force Canvas Alpha Transparency for WebXR Passthrough
        AFRAME.registerComponent('force-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // WebXR Surface Hit-Testing (Snaps Green Box to Real Walls/Desks/Floors)
        AFRAME.registerComponent('webxr-surface-snapper', {
            init: function () {
                this.hitTestSource = null;
                this.placementBox = document.querySelector('#placement-guide-box');
                this.reticleRing = document.querySelector('#hud-reticle');

                this.el.sceneEl.addEventListener('enter-vr', async () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    try {
                        const viewerSpace = await session.requestReferenceSpace('viewer');
                        this.hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
                        console.log("[WEBXR HIT TEST SOURCE CREATED]");
                    } catch (err) {
                        console.warn("[WEBXR HIT TEST ERROR]", err);
                    }
                });
            },
            tick: function () {
                const frame = this.el.sceneEl.frame;
                const refSpace = this.el.sceneEl.systems.webxr.referenceSpace;

                if (frame && this.hitTestSource && refSpace) {
                    const hitTestResults = frame.getHitTestResults(this.hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(refSpace);

                        if (pose) {
                            const pos = pose.transform.position;
                            const orientation = pose.transform.orientation;

                            // Snap Guide Box & Reticle to physical room surfaces
                            this.placementBox.object3D.position.set(pos.x, pos.y, pos.z);
                            this.placementBox.object3D.quaternion.set(orientation.x, orientation.y, orientation.z, orientation.w);
                            this.placementBox.setAttribute('visible', 'true');

                            if (this.reticleRing) {
                                this.reticleRing.object3D.position.set(pos.x, pos.y, pos.z);
                                this.reticleRing.object3D.quaternion.set(orientation.x, orientation.y, orientation.z, orientation.w);
                                this.reticleRing.setAttribute('visible', 'true');
                            }

                            window.currentGazePoint = { x: pos.x, y: pos.y, z: pos.z };
                        }
                    }
                }
            }
        });

        // Global State & Helper Functions
        window.currentGazePoint = null;
        window.activeAnchors = {};
        window.devices = [
            { key: 'smart_climate_node', title: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', title: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', title: 'TARGET: SMART POWER RELAY' }
        ];
        window.currentDeviceIndex = 0;

        function update3DHUDText(text, color = "#00f0ff") {
            const statusEl = document.querySelector('#hud-3d-status');
            if (statusEl) {
                statusEl.setAttribute('value', text);
                statusEl.setAttribute('color', color);
            }
        }

        function update3DTitleText(text) {
            const titleEl = document.querySelector('#hud-3d-title');
            if (titleEl) {
                titleEl.setAttribute('value', text);
            }
        }

        function toggleActiveDevice() {
            window.currentDeviceIndex = (window.currentDeviceIndex + 1) % window.devices.length;
            const current = window.devices[window.currentDeviceIndex];
            update3DTitleText(current.title);
            update3DHUDText("AIM AT WALL OR DESK & PULL TRIGGER", "#00f0ff");
        }

        function saveActiveAnchor() {
            const activeKey = window.devices[window.currentDeviceIndex].key;
            const anchorData = window.activeAnchors[activeKey];

            if (!anchorData || !anchorData.position) {
                update3DHUDText("PULL TRIGGER TO LOCK SPOT FIRST!", "#ff0055");
                return;
            }

            update3DHUDText("COMMITTING ANCHOR TO RENDER DB...", "#00f0ff");

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    deviceId: activeKey, 
                    position: anchorData.position
                })
            })
            .then(res => res.json())
            .then(() => {
                update3DHUDText(`SAVED ${activeKey.toUpperCase()} TO DB!`, "#39ff14");
            })
            .catch(() => {
                update3DHUDText("ERROR COMMITTING ANCHOR TO DB", "#ff0055");
            });
        }

        // Trigger Listener (Locking Object Positions)
        AFRAME.registerComponent('trigger-lock-handler', {
            init: function () {
                this.el.addEventListener('click', (evt) => {
                    // Check if clicking in-world buttons
                    const clickedEl = evt.detail.intersectedEl;
                    if (clickedEl && clickedEl.classList.contains('hud-btn')) return;

                    if (window.currentGazePoint) {
                        const activeKey = window.devices[window.currentDeviceIndex].key;
                        const pt = window.currentGazePoint;

                        window.activeAnchors[activeKey] = {
                            position: {
                                x: parseFloat(pt.x.toFixed(2)),
                                y: parseFloat(pt.y.toFixed(2)),
                                z: parseFloat(pt.z.toFixed(2))
                            }
                        };

                        const previewEl = document.getElementById(`${activeKey}-preview`);
                        if (previewEl) {
                            previewEl.setAttribute('position', `${pt.x} ${pt.y} ${pt.z}`);
                        }

                        update3DHUDText(`LOCKED ${activeKey.toUpperCase()}: (${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}, ${pt.z.toFixed(2)})`, "#39ff14");
                    }
                });
            }
        });
    </script>

    <a-scene 
        force-passthrough
        webxr-surface-snapper
        webxr="requiredFeatures: hit-test, local-floor; referenceSpaceType: local-floor;"
        renderer="colorManagement: true; antialias: true; alpha: true;" 
        xr-mode-ui="enabled: false">

        <!-- Camera Rig & Head-Gaze Raycaster -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity id="hud-pointer"
                          trigger-lock-handler
                          raycaster="objects: .hud-btn, .placement-surface; far: 10;"
                          cursor="fuse: false;" position="0 0 -1"
                          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01"
                          material="color: #00f0ff; shader: flat; opacity: 0.9; depthTest: false;">
                </a-entity>

                <!-- 1. IN-WORLD 3D FLOATING HUD HEADER (Attached below field of view) -->
                <a-entity position="0 -0.45 -1.2" rotation="-15 0 0">
                    <a-plane width="1.1" height="0.32" color="#0d1117" opacity="0.9" material="shader: flat; depthTest: false;"></a-plane>
                    <a-text id="hud-3d-title" value="TARGET: SMART CLIMATE NODE" color="#ffffff" width="1.6" align="center" position="0 0.08 0.01" font="monoid"></a-text>
                    <a-text id="hud-3d-status" value="AIM AT WALL OR DESK & PULL TRIGGER" color="#00f0ff" width="1.2" align="center" position="0 -0.04 0.01" font="monoid"></a-text>
                </a-entity>

                <!-- 2. IN-WORLD 3D ACTION BUTTONS (Gaze & Trigger Operable) -->
                <a-entity position="0 -0.7 -1.2" rotation="-20 0 0">
                    <!-- NEXT DEVICE BUTTON -->
                    <a-entity class="hud-btn" onclick="toggleActiveDevice()" position="-0.32 0 0">
                        <a-plane width="0.5" height="0.16" color="#161b22" material="shader: flat; depthTest: false;"></a-plane>
                        <a-text value="[ NEXT NODE ]" color="#00f0ff" width="1.4" align="center" position="0 0 0.01" font="monoid"></a-text>
                    </a-entity>

                    <!-- SAVE TO DB BUTTON -->
                    <a-entity class="hud-btn" onclick="saveActiveAnchor()" position="0.32 0 0">
                        <a-plane width="0.5" height="0.16" color="#238636" material="shader: flat; depthTest: false;"></a-plane>
                        <a-text value="[ SAVE TO DB ]" color="#ffffff" width="1.4" align="center" position="0 0 0.01" font="monoid"></a-text>
                    </a-entity>
                </a-entity>

            </a-entity>
        </a-entity>

        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

        <!-- Surface Snapping Reticle Ring -->
        <a-ring id="hud-reticle" radius-inner="0.04" radius-outer="0.06" rotation="-90 0 0"
                material="color: #00f0ff; shader: flat; opacity: 0.9; depthTest: false;" visible="false">
        </a-ring>

        <!-- Dynamic Wireframe Surface Guide Box -->
        <a-box id="placement-guide-box" width="0.25" height="0.25" depth="0.25" 
               material="color: #39ff14; wireframe: true; opacity: 0.95; shader: flat; depthTest: false;" visible="false">
        </a-box>

        <!-- HARDWARE PREVIEW NODES -->
        <a-entity id="noemata-spatial-anchor">
            <a-entity id="smart_climate_node-preview" position="0 1.4 -1.2">
                <a-box width="0.18" height="0.18" depth="0.18" material="color: #00f0ff; shader: flat; wireframe: true; depthTest: false;"></a-box>
                <a-text value="[ CLIMATE NODE ]" position="0 0.18 0" width="1.2" align="center" color="#00f0ff" font="monoid"></a-text>
            </a-entity>

            <a-entity id="perimeter_monitor-preview" position="-0.6 1.4 -1.5">
                <a-cylinder radius="0.12" height="0.18" material="color: #00f0ff; shader: flat; wireframe: true; depthTest: false;"></a-cylinder>
                <a-text value="[ PERIMETER GUARD ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>
            </a-entity>

            <a-entity id="smart_power_relay-preview" position="0.6 1.4 -1.5">
                <a-box width="0.15" height="0.15" depth="0.15" material="color: #64748b; shader: flat; wireframe: true; depthTest: false;"></a-box>
                <a-text value="[ POWER RELAY ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        // Load DB positions on startup
        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => {
                const map = db.anchors || db;
                window.devices.forEach(item => {
                    if (map[item.key] && map[item.key].x !== undefined) {
                        const previewEl = document.getElementById(`${item.key}-preview`);
                        if (previewEl) {
                            previewEl.setAttribute('position', `${map[item.key].x} ${map[item.key].y} ${map[item.key].z}`);
                        }
                    }
                });
            });

        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            if (sceneEl.enterAR) sceneEl.enterAR();
            else if (sceneEl.enterVR) sceneEl.enterVR();
            document.getElementById('custom-ar-btn').style.display = 'none';
        });
    </script>
</body>
</html>
