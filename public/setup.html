<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL ANCHOR SETUP</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 99999;
            padding: 16px 28px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <button id="custom-ar-btn">ENTER NOEMATA AR SETUP</button>

    <script>
        window.alignSceneToPoints = function (livePoints, referencePoints, targetEntity) {
            if (!livePoints || !referencePoints || livePoints.length < 3 || referencePoints.length < 3) return;

            try {
                const pLive = livePoints.map(p => new THREE.Vector3(parseFloat(p.x), parseFloat(p.y), parseFloat(p.z)));
                const pRef = referencePoints.map(p => new THREE.Vector3(parseFloat(p.x), parseFloat(p.y), parseFloat(p.z)));

                const liveOrigin = pLive[0].clone();
                const refOrigin = pRef[0].clone();

                const dirLiveX = new THREE.Vector3().subVectors(pLive[1], liveOrigin).normalize();
                const dirRefX = new THREE.Vector3().subVectors(pRef[1], refOrigin).normalize();

                const dirLive3 = new THREE.Vector3().subVectors(pLive[2], liveOrigin).normalize();
                const dirRef3 = new THREE.Vector3().subVectors(pRef[2], refOrigin).normalize();

                const normalLive = new THREE.Vector3().crossVectors(dirLiveX, dirLive3).normalize();
                const normalRef = new THREE.Vector3().crossVectors(dirRefX, dirRef3).normalize();

                const dirLiveY = new THREE.Vector3().crossVectors(normalLive, dirLiveX).normalize();
                const dirRefY = new THREE.Vector3().crossVectors(normalRef, dirRefX).normalize();

                const mLive = new THREE.Matrix4().set(
                    dirLiveX.x, dirLiveY.x, normalLive.x, 0,
                    dirLiveX.y, dirLiveY.y, normalLive.y, 0,
                    dirLiveX.z, dirLiveY.z, normalLive.z, 0,
                    0, 0, 0, 1
                );

                const mRef = new THREE.Matrix4().set(
                    dirRefX.x, dirRefY.x, normalRef.x, 0,
                    dirRefX.y, dirRefY.y, normalRef.y, 0,
                    dirRefX.z, dirRefY.z, normalRef.z, 0,
                    0, 0, 0, 1
                );

                const mLiveInv = new THREE.Matrix4().copy(mLive).invert();
                const mRotation = new THREE.Matrix4().multiplyMatrices(mRef, mLiveInv);

                const quaternion = new THREE.Quaternion().setFromRotationMatrix(mRotation);
                const rotatedLiveOrigin = liveOrigin.clone().applyQuaternion(quaternion);
                const translation = refOrigin.clone().sub(rotatedLiveOrigin);

                targetEntity.object3D.position.copy(translation);
                targetEntity.object3D.quaternion.copy(quaternion);
                targetEntity.object3D.updateMatrixWorld(true);

                console.log("[ALIGNMENT SUCCESS] Matrix applied.");
            } catch (err) {
                console.error("[ALIGNMENT ERROR]", err);
            }
        };

        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        AFRAME.registerComponent('noemata-spatial-manager', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        this.viewerSpace = refSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.log('Hit-test source error:', e));
                    }).catch(e => console.log('Viewer space error:', e));

                    session.requestReferenceSpace('local-floor').catch(() => {
                        return session.requestReferenceSpace('local');
                    }).then((refSpace) => {
                        this.refSpace = refSpace;
                    });

                    // TRIGGER SELECTION LISTENER
                    session.addEventListener('select', () => {
                        if (window.isHoveringButton || !window.latestHitPos) return;

                        // STAGE 1: LANDMARK ALIGNMENT (Taps 0, 1, 2)
                        if (window.alignmentStep < 3) {
                            window.capturedLivePoints.push({ ...window.latestHitPos });
                            window.alignmentStep++;

                            const statusLabel = document.getElementById('hud-status-label');

                            if (window.alignmentStep < 3) {
                                const nextLandmark = window.storedRefPoints[window.alignmentStep].label.toUpperCase();
                                statusLabel.setAttribute('value', `TAP ${window.alignmentStep + 1}: ${nextLandmark}`);
                                statusLabel.setAttribute('color', '#00f0ff');
                            } else {
                                statusLabel.setAttribute('value', 'ALIGNING & SAVING MATRIX TO DB...');
                                statusLabel.setAttribute('color', '#39ff14');

                                const roomEntity = document.getElementById('world-mesh');
                                window.alignSceneToPoints(window.capturedLivePoints, window.storedRefPoints, roomEntity);

                                // Save Matrix to Database permanently
                                fetch('/api/spatial/register-matrix', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        position: roomEntity.object3D.position,
                                        quaternion: roomEntity.object3D.quaternion
                                    })
                                }).then(() => {
                                    statusLabel.setAttribute('value', 'MATRIX SAVED! AIM AT HARDWARE & LOCK');
                                });
                            }
                            return;
                        }

                        // STAGE 2: HARDWARE ANCHOR PLACEMENT
                        if (!window.isPosLocked) {
                            window.isPosLocked = true;

                            // CONVERT WORLD HIT POSITION TO LOCAL ROOM MESH COORDINATES
                            const roomEntity = document.getElementById('world-mesh');
                            const worldVec = new THREE.Vector3(
                                parseFloat(window.latestHitPos.x),
                                parseFloat(window.latestHitPos.y),
                                parseFloat(window.latestHitPos.z)
                            );
                            const localVec = roomEntity.object3D.worldToLocal(worldVec);

                            window.lockedCoords = {
                                x: localVec.x.toFixed(3),
                                y: localVec.y.toFixed(3),
                                z: localVec.z.toFixed(3)
                            };

                            const statusLabel = document.getElementById('hud-status-label');
                            const saveBtn = document.getElementById('btn-save-device');
                            const saveBtnText = document.getElementById('save-btn-text');

                            if (statusLabel) {
                                statusLabel.setAttribute('value', 'SURFACE LOCKED! CLICK ANCHOR NOW.');
                                statusLabel.setAttribute('color', '#39ff14');
                            }
                            if (saveBtn) saveBtn.setAttribute('color', '#00f0ff');
                            if (saveBtnText) saveBtnText.setAttribute('color', '#000000');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isPosLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    const hit = hitTestResults[0];
                    const pose = hit.getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        this.previewEl.object3D.position.set(p.x, p.y, p.z);
                        this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.previewEl.setAttribute('visible', 'true');

                        window.latestHitPos = { x: p.x.toFixed(3), y: p.y.toFixed(3), z: p.z.toFixed(3) };
                    }
                }
            }
        });
    </script>

    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: anchors, unbounded; referenceSpaceType: local-floor;"
             force-ar-passthrough
             background="transparent: true"
             noemata-spatial-manager
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false"
             style="background-color: rgba(0,0,0,0) !important; background: transparent !important;">
        
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <a-entity id="world-mesh" position="0 0 0"></a-entity>

        <a-entity laser-controls="hand: left" raycaster="objects: .ui-button; far: 5;"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .ui-button; far: 5;"></a-entity>

        <!-- FLOATING HUD TERMINAL -->
        <a-entity id="world-terminal" position="0 1.4 -1.5">
            <a-plane width="1.4" height="0.75" color="#0d1117" opacity="0.92" material="shader: flat; depthTest: true;"></a-plane>
            <a-plane width="1.44" height="0.79" color="#00f0ff" opacity="0.3" position="0 0 -0.005" material="shader: flat; depthTest: true;"></a-plane>

            <a-text id="hud-device-label" 
                    value="TARGET: SMART CLIMATE NODE" 
                    color="#00f0ff" 
                    align="center" 
                    width="2.0" 
                    position="0 0.24 0.02" 
                    font="monoid"
                    wrap-count="30">
            </a-text>

            <a-text id="hud-status-label" 
                    value="TAP 1: CARPET CORNER" 
                    color="#00f0ff" 
                    align="center" 
                    width="1.5" 
                    position="0 0.08 0.02" 
                    font="monoid"
                    wrap-count="38">
            </a-text>

            <a-plane class="ui-button" id="btn-toggle-device" width="0.55" height="0.16" color="#1e293b" position="-0.35 -0.18 0.03" material="shader: flat; depthTest: true;">
                <a-text value="[ NEXT DEVICE ]" color="#00f0ff" width="1.3" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <a-plane class="ui-button" id="btn-save-device" width="0.55" height="0.16" color="#334155" position="0.35 -0.18 0.03" material="shader: flat; depthTest: true;">
                <a-text id="save-btn-text" value="[ CREATE ANCHOR ]" color="#94a3b8" width="1.3" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.1" color="#39ff14" rotation="-90 0 0" material="shader: flat; depthTest: true;"></a-ring>
            <a-box size="0.12" material="color: #39ff14; wireframe: true; depthTest: true;" position="0 0.06 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        window.isPosLocked = false;
        window.latestHitPos = null;
        window.lockedCoords = null;
        window.isHoveringButton = false;

        window.storedRefPoints = [
            { "id": "ref_point_1", "label": "Carpet Corner", "x": 0.000, "y": 0.000, "z": 0.000 },
            { "id": "ref_point_2", "label": "Cabinet Corner", "x": -1.088, "y": 0.838, "z": 0.190 },
            { "id": "ref_point_3", "label": "Desk Corner", "x": 1.499, "y": 0.603, "z": 2.494 }
        ];
        window.capturedLivePoints = [];
        window.alignmentStep = 0;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');
        const saveBtnText = document.getElementById('save-btn-text');

        [toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringButton = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringButton = false; });
        });

        toggleBtn.addEventListener('click', () => {
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            resetLock();
        });

        saveBtn.addEventListener('click', async () => {
            if (!window.lockedCoords) return;

            const activeKey = devices[currentDeviceIndex].key;
            statusLabel.setAttribute('value', 'SAVING ANCHOR TO RENDER SERVER...');
            statusLabel.setAttribute('color', '#00f0ff');

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: activeKey, position: window.lockedCoords })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `SAVED ${activeKey.toUpperCase()}!`);
                statusLabel.setAttribute('color', '#39ff14');
                setTimeout(() => resetLock(), 1800);
            });
        });

        function resetLock() {
            window.isPosLocked = false;
            window.lockedCoords = null;
            saveBtn.setAttribute('color', '#334155');
            saveBtnText.setAttribute('color', '#94a3b8');
            statusLabel.setAttribute('value', 'AIM AT HARDWARE NODE & LOCK');
            statusLabel.setAttribute('color', '#94a3b8');
        }

        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            const launch = () => {
                if (sceneEl.enterAR) sceneEl.enterAR();
                else sceneEl.enterVR();
                button.style.display = 'none';
            };

            if (sceneEl.hasLoaded) launch();
            else sceneEl.addEventListener('loaded', launch);
        });
    </script>
</body>
</html>
