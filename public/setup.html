<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noemata // QR Datum Quest Mapper</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #090d16;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #launch-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 99999;
            padding: 16px 32px; background: #2563eb; color: #fff;
            border: none; border-radius: 12px; font-weight: 700; font-size: 16px;
            cursor: pointer; box-shadow: 0 4px 20px rgba(37,99,235,0.4);
        }
    </style>
</head>
<body>

    <button id="launch-btn">ENTER PASSTHROUGH MAPPER</button>

    <script>
        AFRAME.registerComponent('qr-datum-tracker', {
            init: function () {
                this.rightHand = document.getElementById('right-hand');
                this.reticle = document.getElementById('surface-reticle');
                this.qrDatumWorldPos = null;
                window.isPositionLocked = false;
                window.calculatedCoords = { x: 0, y: 0, z: 0 };
                window.isHoveringUI = false;

                // Controller Trigger to lock target
                const lockHandler = () => {
                    if (window.isHoveringUI || !window.currentRawHit) return;

                    // If setting QR code origin
                    if (window.settingQrMode) {
                        this.qrDatumWorldPos = { ...window.currentRawHit };
                        window.settingQrMode = false;
                        const btnQr = document.getElementById('btn-set-qr');
                        const txtQr = document.getElementById('txt-set-qr');
                        const hudStatus = document.getElementById('hud-coords');

                        if (btnQr) btnQr.setAttribute('color', '#10b981');
                        if (txtQr) txtQr.setAttribute('value', 'QR CODE (0,0,0) LOCKED!');
                        if (hudStatus) hudStatus.setAttribute('value', 'NOW AIM AT SENSORS & TRIGGER');
                        return;
                    }

                    // Standard sensor lock
                    window.isPositionLocked = !window.isPositionLocked;
                    const sphere = document.querySelector('#surface-reticle a-sphere');
                    const txtSave = document.getElementById('txt-save');
                    const btnSave = document.getElementById('btn-save');

                    if (window.isPositionLocked) {
                        if (sphere) sphere.setAttribute('color', '#ef4444');
                        if (txtSave) txtSave.setAttribute('value', 'SAVE PIN');
                        if (btnSave) btnSave.setAttribute('color', '#10b981');
                    } else {
                        if (sphere) sphere.setAttribute('color', '#38bdf8');
                        if (txtSave) txtSave.setAttribute('value', '[ TRIGGER TO LOCK ]');
                        if (btnSave) btnSave.setAttribute('color', '#334155');
                    }
                };

                this.el.addEventListener('triggerdown', lockHandler);
                this.el.addEventListener('select', lockHandler);
            },

            tick: function () {
                if (!this.rightHand || window.isPositionLocked) return;

                const handObj = this.rightHand.object3D;
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(handObj.quaternion);
                
                const targetPos = new THREE.Vector3()
                    .copy(handObj.position)
                    .add(dir.multiplyScalar(2.2));

                this.reticle.object3D.position.copy(targetPos);
                this.reticle.setAttribute('visible', 'true');

                window.currentRawHit = { x: targetPos.x, y: targetPos.y, z: targetPos.z };

                // Calculate relative to QR Datum if set
                const origin = this.qrDatumWorldPos || { x: 0, y: 0, z: 0 };
                window.calculatedCoords = {
                    x: parseFloat((targetPos.x - origin.x).toFixed(2)),
                    y: parseFloat((targetPos.y - origin.y).toFixed(2)),
                    z: parseFloat((targetPos.z - origin.z).toFixed(2))
                };

                const readout = document.getElementById('hud-coords');
                if (readout && !window.settingQrMode) {
                    readout.setAttribute('value', `REL TO QR: X:${window.calculatedCoords.x} Y:${window.calculatedCoords.y} Z:${window.calculatedCoords.z}`);
                }
            }
        });
    </script>

    <a-scene qr-datum-tracker
             webxr="optionalFeatures: local-floor;"
             renderer="alpha: true; antialias: true;"
             xr-mode-ui="enabled: false">
        
        <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>

        <a-entity id="left-hand" laser-controls="hand: left" raycaster="objects: .ui-btn; far: 10;"></a-entity>
        <a-entity id="right-hand" laser-controls="hand: right" raycaster="objects: .ui-btn; far: 10;"></a-entity>

        <!-- FLOATING CONTROL TERMINAL -->
        <a-entity id="hud-panel" position="0 1.35 -1.2">
            <a-plane width="1.45" height="0.85" color="#0f172a" opacity="0.95"></a-plane>

            <a-text id="hud-title" value="TARGET: SMART CLIMATE NODE" color="#38bdf8" align="center" width="1.8" position="0 0.30 0.01" font="roboto"></a-text>
            <a-text id="hud-coords" value="1. AIM AT PHYSICAL QR CODE & CLICK PIN" color="#34d399" align="center" width="1.3" position="0 0.16 0.01" font="roboto"></a-text>

            <!-- 1. Set QR Code as (0,0,0) -->
            <a-plane class="ui-btn" id="btn-set-qr" width="1.2" height="0.11" color="#e11d48" position="0 0.02 0.02">
                <a-text id="txt-set-qr" value="[ 1. PIN QR CODE AS (0,0,0) DATUM ]" color="#ffffff" width="1.1" align="center" position="0 0 0.01" font="roboto"></a-text>
            </a-plane>

            <!-- Switch & Save -->
            <a-plane class="ui-btn" id="btn-next" width="0.55" height="0.12" color="#1e293b" position="-0.33 -0.20 0.02">
                <a-text value="NEXT DEVICE" color="#38bdf8" width="1.1" align="center" position="0 0 0.01" font="roboto"></a-text>
            </a-plane>
            <a-plane class="ui-btn" id="btn-save" width="0.55" height="0.12" color="#334155" position="0.33 -0.20 0.02">
                <a-text id="txt-save" value="[ TRIGGER TO LOCK ]" color="#94a3b8" width="1.0" align="center" position="0 0 0.01" font="roboto"></a-text>
            </a-plane>
        </a-entity>

        <!-- RETICLE -->
        <a-entity id="surface-reticle" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.12" color="#34d399" rotation="-90 0 0"></a-ring>
            <a-sphere radius="0.04" color="#38bdf8"></a-sphere>
            <a-box width="0.14" height="0.14" depth="0.14" material="wireframe: true; color: #34d399;" position="0 0.07 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        window.settingQrMode = false;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentIdx = 0;

        const hudTitle = document.getElementById('hud-title');
        const btnSetQr = document.getElementById('btn-set-qr');
        const txtSetQr = document.getElementById('txt-set-qr');
        const btnNext = document.getElementById('btn-next');
        const btnSave = document.getElementById('btn-save');
        const txtSave = document.getElementById('txt-save');

        document.querySelectorAll('.ui-btn').forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { window.isHoveringUI = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { window.isHoveringUI = false; });
        });

        // Toggle QR Datum Pin Mode
        btnSetQr.addEventListener('click', () => {
            window.settingQrMode = true;
            btnSetQr.setAttribute('color', '#3b82f6');
            txtSetQr.setAttribute('value', 'AIM LASER AT QR STICKER & PULL TRIGGER');
        });

        btnNext.addEventListener('click', () => {
            currentIdx = (currentIdx + 1) % devices.length;
            hudTitle.setAttribute('value', devices[currentIdx].label);
            resetLock();
        });

        btnSave.addEventListener('click', () => {
            if (!window.calculatedCoords) return;
            const activeKey = devices[currentIdx].key;

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: activeKey, position: window.calculatedCoords })
            })
            .then(res => res.json())
            .then(() => {
                txtSave.setAttribute('value', 'PIN SAVED!');
                btnSave.setAttribute('color', '#2563eb');
                setTimeout(resetLock, 1200);
            });
        });

        function resetLock() {
            window.isPositionLocked = false;
            const sphere = document.querySelector('#surface-reticle a-sphere');
            if (sphere) sphere.setAttribute('color', '#38bdf8');
            btnSave.setAttribute('color', '#334155');
            txtSave.setAttribute('value', '[ TRIGGER TO LOCK ]');
        }

        document.getElementById('launch-btn').addEventListener('click', () => {
            const scene = document.querySelector('a-scene');
            if (scene.enterVR) scene.enterVR();
            document.getElementById('launch-btn').style.display = 'none';
        });
    </script>
</body>
</html>
