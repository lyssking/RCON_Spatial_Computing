<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL ANCHOR SETUP</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 99999;
            padding: 16px 28px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <button id="custom-ar-btn">ENTER MOBILE AR SETUP</button>

    <script>
        // Force WebGL Canvas Transparency for AR Passthrough
        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                        scene.renderer.alpha = true;
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // Mobile Hit-Testing & Surface Lock Manager
        AFRAME.registerComponent('noemata-spatial-manager', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session) return;

                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        this.viewerSpace = refSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.log('Hit-test source error:', e));
                    }).catch(e => console.log('Viewer space error:', e));

                    session.requestReferenceSpace('local-floor').catch(() => {
                        return session.requestReferenceSpace('local');
                    }).then((refSpace) => {
                        this.refSpace = refSpace;
                    });

                    // Lock surface location on tap (when not tapping a UI button)
                    session.addEventListener('select', () => {
                        if (!window.isHoveringButton && window.latestHitPos && !window.isPosLocked) {
                            window.isPosLocked = true;
                            window.lockedCoords = { ...window.latestHitPos };

                            const statusLabel = document.getElementById('hud-status-label');
                            const saveBtn = document.getElementById('btn-save-device');
                            const saveBtnText = document.getElementById('save-btn-text');

                            if (statusLabel) {
                                statusLabel.setAttribute('value', 'SURFACE LOCKED! TAP CREATE ANCHOR.');
                                statusLabel.setAttribute('color', '#39ff14');
                            }
                            if (saveBtn) saveBtn.setAttribute('color', '#00f0ff');
                            if (saveBtnText) saveBtnText.setAttribute('color', '#000000');
                        }
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isPosLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    const hitResult = hitTestResults[0];
                    const pose = hitResult.getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        if (this.previewEl) {
                            this.previewEl.object3D.position.set(p.x, p.y, p.z);
                            this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                            this.previewEl.setAttribute('visible', 'true');
                        }

                        window.latestHitPos = { 
                            x: parseFloat(p.x.toFixed(3)), 
                            y: parseFloat(p.y.toFixed(3)), 
                            z: parseFloat(p.z.toFixed(3)) 
                        };
                    }
                }
            }
        });
    </script>

    <!-- Configure Native A-Frame Scene -->
    <a-scene webxr="requiredFeatures: hit-test, local-floor; optionalFeatures: anchors; referenceSpaceType: local-floor;"
             force-ar-passthrough
             noemata-spatial-manager
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false">
        
        <!-- Mobile Camera with Touch Mouse Cursor for Buttons -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls>
                <a-entity cursor="rayOrigin: mouse; fuse: false;"
                          raycaster="objects: .ui-button; far: 5;">
                </a-entity>
            </a-entity>
        </a-entity>

        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

        <!-- FLOATING UI TERMINAL CARD -->
        <a-entity id="world-terminal" position="0 1.3 -1.0">
            
            <!-- Dark Card Background -->
            <a-plane width="1.2" height="0.65" color="#0d1117" opacity="0.95" material="shader: flat; depthTest: false;"></a-plane>
            
            <!-- Outer Cyan Frame -->
            <a-plane width="1.24" height="0.69" color="#00f0ff" opacity="0.4" position="0 0 -0.005" material="shader: flat; depthTest: false;"></a-plane>

            <!-- Header Text -->
            <a-text id="hud-device-label" 
                    value="TARGET: SMART CLIMATE NODE" 
                    color="#00f0ff" 
                    align="center" 
                    width="1.8" 
                    position="0 0.20 0.01" 
                    font="monoid">
            </a-text>

            <!-- Status Instructions -->
            <a-text id="hud-status-label" 
                    value="POINT AT SURFACE & TAP TO LOCK" 
                    color="#94a3b8" 
                    align="center" 
                    width="1.3" 
                    position="0 0.06 0.01" 
                    font="monoid">
            </a-text>

            <!-- Next Device Button -->
            <a-plane class="ui-button" id="btn-toggle-device" width="0.48" height="0.14" color="#1e293b" position="-0.28 -0.14 0.02" material="shader: flat; depthTest: false;">
                <a-text value="[ NEXT DEVICE ]" color="#00f0ff" width="1.1" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <!-- Create Anchor Button -->
            <a-plane class="ui-button" id="btn-save-device" width="0.48" height="0.14" color="#334155" position="0.28 -0.14 0.02" material="shader: flat; depthTest: false;">
                <a-text id="save-btn-text" value="[ CREATE ANCHOR ]" color="#94a3b8" width="1.1" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <!-- GREEN TARGET RETICLE BOX & RING -->
        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.06" radius-outer="0.08" color="#39ff14" rotation="-90 0 0" material="shader: flat; depthTest: false;"></a-ring>
            <a-box width="0.10" height="0.10" depth="0.10" material="color: #39ff14; wireframe: true; depthTest: false;" position="0 0.05 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });

        window.isPosLocked = false;
        window.latestHitPos = null;
        window.lockedCoords = null;
        window.isHoveringButton = false;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');
        const saveBtnText = document.getElementById('save-btn-text');

        // Prevent surface lock when hovering buttons
        [toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('mouseenter', () => { window.isHoveringButton = true; });
            btn.addEventListener('mouseleave', () => { window.isHoveringButton = false; });
        });

        // Toggle Next Device
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            resetLock();
        });

        // Save Anchor Position
        saveBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (!window.lockedCoords) return;

            const activeKey = devices[currentDeviceIndex].key;

            statusLabel.setAttribute('value', 'REGISTERING SPATIAL ANCHOR...');
            statusLabel.setAttribute('color', '#00f0ff');

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    deviceId: activeKey, 
                    position: window.lockedCoords
                })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `SAVED ${activeKey.toUpperCase()}!`);
                statusLabel.setAttribute('color', '#39ff14');
                setTimeout(() => resetLock(), 1800);
            })
            .catch(err => {
                statusLabel.setAttribute('value', 'SAVE ERROR! CHECK CONNECTION.');
                statusLabel.setAttribute('color', '#ff0055');
            });
        });

        function resetLock() {
            window.isPosLocked = false;
            window.lockedCoords = null;
            saveBtn.setAttribute('color', '#334155');
            saveBtnText.setAttribute('color', '#94a3b8');
            statusLabel.setAttribute('value', 'POINT AT SURFACE & TAP TO LOCK');
            statusLabel.setAttribute('color', '#94a3b8');
        }

        // WebAR enterAR Launcher
        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            if (sceneEl.enterAR) {
                sceneEl.enterAR();
            } else if (sceneEl.enterVR) {
                sceneEl.enterVR();
            }
            button.style.display = 'none';
        });
    </script>
</body>
</html>
