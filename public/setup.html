<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // SPATIAL ANCHOR SETUP</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html, body, .a-canvas {
            background-color: transparent !important;
            background: transparent !important;
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
        }
        #custom-ar-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 99999;
            padding: 16px 28px;
            background: #00f0ff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; background: transparent !important;">

    <button id="custom-ar-btn">ENTER NOEMATA AR</button>

    <script>
        // Force WebGL Canvas Transparency for AR Passthrough Video
        AFRAME.registerComponent('force-ar-passthrough', {
            init: function () {
                const scene = this.el;
                const setTransparent = () => {
                    if (scene.renderer) {
                        scene.renderer.setClearColor(0x000000, 0);
                    }
                };
                scene.addEventListener('render-target-loaded', setTransparent);
                scene.addEventListener('enter-vr', setTransparent);
            }
        });

        // Hit-Testing & Spatial Anchor Component for Quest 3 Room Mesh
        AFRAME.registerComponent('noemata-spatial-manager', {
            init: function () {
                this.xrHitTestSource = null;
                this.viewerSpace = null;
                this.refSpace = null;
                this.previewEl = document.getElementById('placement-preview');

                this.el.sceneEl.addEventListener('enter-vr', () => {
                    const session = this.el.sceneEl.xrSession;
                    if (!session || !session.requestHitTestSource) return;

                    session.requestReferenceSpace('viewer').then((refSpace) => {
                        this.viewerSpace = refSpace;
                        session.requestHitTestSource({ space: this.viewerSpace }).then((source) => {
                            this.xrHitTestSource = source;
                        }).catch(e => console.log('Hit-test source unavailable:', e));
                    }).catch(e => console.log('Viewer space error:', e));

                    session.requestReferenceSpace('local-floor').catch(() => {
                        return session.requestReferenceSpace('local');
                    }).then((refSpace) => {
                        this.refSpace = refSpace;
                    });
                });
            },

            tick: function () {
                if (!this.xrHitTestSource || !this.refSpace || window.isPosLocked) return;

                const frame = this.el.sceneEl.frame;
                if (!frame) return;

                const hitTestResults = frame.getHitTestResults(this.xrHitTestSource);
                if (hitTestResults.length > 0) {
                    this.lastHitResult = hitTestResults[0];
                    const pose = this.lastHitResult.getPose(this.refSpace);
                    if (pose) {
                        const p = pose.transform.position;
                        const q = pose.transform.orientation;

                        this.previewEl.object3D.position.set(p.x, p.y, p.z);
                        this.previewEl.object3D.quaternion.set(q.x, q.y, q.z, q.w);
                        this.previewEl.setAttribute('visible', 'true');

                        window.latestHitPos = { x: p.x.toFixed(2), y: p.y.toFixed(2), z: p.z.toFixed(2) };
                    }
                }
            }
        });
    </script>

    <!-- Configure WebXR system for local-floor 6DoF tracking and Quest 3 hit testing -->
    <a-scene webxr="optionalFeatures: hit-test, anchors, local-floor; referenceSpaceType: local-floor;"
             force-ar-passthrough
             background="transparent: true"
             noemata-spatial-manager
             renderer="alpha: true; colorManagement: true; antialias: true;"
             xr-mode-ui="enabled: false"
             style="background-color: rgba(0,0,0,0) !important; background: transparent !important;">
        
        <!-- Camera Rig for 6DoF Room-Scale Movement -->
        <a-entity id="rig" position="0 0 0">
            <a-entity id="main-camera" camera position="0 1.6 0" look-controls></a-entity>
        </a-entity>

        <!-- Laser Controllers with Raycaster targeting UI buttons -->
        <a-entity id="left-controller" laser-controls="hand: left" raycaster="objects: .ui-button; far: 5;"></a-entity>
        <a-entity id="right-controller" laser-controls="hand: right" raycaster="objects: .ui-button; far: 5;"></a-entity>

        <!-- WORLD-ANCHORED CONTROL TERMINAL: Styled cybernetic panel -->
        <a-entity id="world-terminal" position="0 1.4 -1.5">
            <a-cylinder radius="0.015" height="0.9" color="#1e293b" position="0 -0.45 0" material="shader: flat;"></a-cylinder>
            
            <a-plane width="1.1" height="0.55" color="#121620" opacity="0.95" material="shader: flat; depthTest: true;"></a-plane>
            <a-plane width="1.14" height="0.59" color="#00f0ff" opacity="0.4" position="0 0 -0.005" material="shader: flat; depthTest: true;"></a-plane>

            <a-text id="hud-device-label" 
                    value="TARGET: SMART CLIMATE NODE" 
                    color="#00f0ff" 
                    align="center" 
                    width="1.2" 
                    position="0 0.18 0.02" 
                    font="monoid"
                    wrap-count="28">
            </a-text>

            <a-text id="hud-status-label" 
                    value="AIM AT HARDWARE & PULL TRIGGER TO LOCK" 
                    color="#64748b" 
                    align="center" 
                    width="0.95" 
                    position="0 0.07 0.02" 
                    font="monoid"
                    wrap-count="36">
            </a-text>

            <a-plane class="ui-button" id="btn-toggle-device" width="0.42" height="0.13" color="#232d3f" position="-0.24 -0.1 0.03" material="shader: flat; depthTest: true;">
                <a-text value="[ NEXT DEVICE ]" color="#00f0ff" width="0.95" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>

            <a-plane class="ui-button" id="btn-save-device" width="0.42" height="0.13" color="#334155" position="0.24 -0.1 0.03" material="shader: flat; depthTest: true;">
                <a-text id="save-btn-text" value="[ CREATE ANCHOR ]" color="#94a3b8" width="0.95" align="center" position="0 0 0.01" font="monoid"></a-text>
            </a-plane>
        </a-entity>

        <!-- Hit-Test Room Surface Placement Ring -->
        <a-entity id="placement-preview" visible="false">
            <a-ring radius-inner="0.08" radius-outer="0.1" color="#39ff14" rotation="-90 0 0" material="shader: flat; depthTest: true;"></a-ring>
            <a-box size="0.12" material="color: #39ff14; wireframe: true; depthTest: true;" position="0 0.06 0"></a-box>
        </a-entity>

    </a-scene>

    <script>
        const socket = io();
        window.isPosLocked = false;
        window.latestHitPos = null;

        const devices = [
            { key: 'smart_climate_node', label: 'TARGET: SMART CLIMATE NODE' },
            { key: 'perimeter_monitor', label: 'TARGET: PERIMETER MONITOR' },
            { key: 'smart_power_relay', label: 'TARGET: SMART POWER RELAY' }
        ];
        let currentDeviceIndex = 0;
        let lockedCoords = null;
        let isHoveringButton = false;

        const deviceLabel = document.getElementById('hud-device-label');
        const statusLabel = document.getElementById('hud-status-label');
        const toggleBtn = document.getElementById('btn-toggle-device');
        const saveBtn = document.getElementById('btn-save-device');
        const saveBtnText = document.getElementById('save-btn-text');

        // Track when laser is pointing at terminal buttons
        [toggleBtn, saveBtn].forEach(btn => {
            btn.addEventListener('raycaster-intersected', () => { isHoveringButton = true; });
            btn.addEventListener('raycaster-intersected-cleared', () => { isHoveringButton = false; });
        });

        toggleBtn.addEventListener('click', () => {
            currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
            deviceLabel.setAttribute('value', devices[currentDeviceIndex].label);
            resetLock();
        });

        saveBtn.addEventListener('click', async () => {
            if (!lockedCoords) return;

            const sceneEl = document.querySelector('a-scene');
            const spatialComp = sceneEl.components['noemata-spatial-manager'];
            const activeKey = devices[currentDeviceIndex].key;

            statusLabel.setAttribute('value', 'LOCKING ANCHOR TO META OS...');
            statusLabel.setAttribute('color', '#00f0ff');

            let anchorUUID = null;

            try {
                if (spatialComp && spatialComp.lastHitResult && spatialComp.lastHitResult.createAnchor) {
                    const anchor = await spatialComp.lastHitResult.createAnchor();
                    if (anchor && anchor.requestPersistentHandle) {
                        anchorUUID = await anchor.requestPersistentHandle();
                        console.log(`[META OS ANCHOR PERSISTED] Handle: ${anchorUUID}`);
                    }
                }
            } catch (err) {
                console.warn("[Anchor Persist Warning] Saving position fallback:", err);
            }

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    deviceId: activeKey, 
                    position: lockedCoords,
                    anchorUUID: anchorUUID 
                })
            })
            .then(res => res.json())
            .then(() => {
                statusLabel.setAttribute('value', `SAVED ${activeKey.toUpperCase()}!`);
                statusLabel.setAttribute('color', '#39ff14');
                setTimeout(() => resetLock(), 1800);
            });
        });

        // LISTEN FOR CONTROLLER TRIGGER PULL TO LOCK HIT LOCATION ON SCANNED ROOM MESH
        document.querySelector('a-scene').addEventListener('enter-vr', () => {
            const session = document.querySelector('a-scene').xrSession;
            if (session) {
                session.addEventListener('select', () => {
                    // Only lock position if trigger is pulled in open space (not clicking terminal buttons)
                    if (!isHoveringButton && window.latestHitPos && !window.isPosLocked) {
                        window.isPosLocked = true;
                        lockedCoords = { ...window.latestHitPos };

                        statusLabel.setAttribute('value', 'SURFACE LOCKED! CLICK ANCHOR NOW.');
                        statusLabel.setAttribute('color', '#39ff14');
                        saveBtn.setAttribute('color', '#00f0ff');
                        saveBtnText.setAttribute('color', '#000000');
                    }
                });
            }
        });

        function resetLock() {
            window.isPosLocked = false;
            lockedCoords = null;
            saveBtn.setAttribute('color', '#334155');
            saveBtnText.setAttribute('color', '#94a3b8');
            statusLabel.setAttribute('value', 'AIM AT HARDWARE & PULL TRIGGER TO LOCK');
            statusLabel.setAttribute('color', '#64748b');
        }

        // Trigger scene.enterAR() for Native WebXR AR Passthrough Mode
        document.getElementById('custom-ar-btn').addEventListener('click', () => {
            const sceneEl = document.querySelector('a-scene');
            const button = document.getElementById('custom-ar-btn');

            const startAR = () => {
                if (sceneEl.enterAR) {
                    sceneEl.enterAR();
                } else {
                    sceneEl.enterVR();
                }
                button.style.display = 'none';
            };

            if (sceneEl.hasLoaded) {
                startAR();
            } else {
                sceneEl.addEventListener('loaded', startAR);
            }
        });
    </script>
</body>
</html>
