<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOEMATA // MINDAR ADMIN SETUP</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        
        #admin-panel {
            position: absolute; top: 20px; left: 20px; z-index: 99999;
            background: rgba(13, 17, 23, 0.92); border: 1px solid #00f0ff;
            border-radius: 8px; padding: 16px; color: #00f0ff;
            font-family: monospace; width: 280px; box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }
        h3 { margin: 0 0 10px 0; font-size: 14px; letter-spacing: 1px; color: #fff; }
        select, button {
            width: 100%; padding: 8px; margin-bottom: 8px; background: #161b22;
            border: 1px solid #30363d; color: #00f0ff; font-family: monospace;
            font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        .step-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 8px; }
        .step-btn { padding: 6px; font-size: 11px; background: #21262d; border: 1px solid #30363d; color: #fff; }
        #save-btn { background: #238636; color: #fff; border: none; margin-top: 8px; font-size: 13px; }
        #save-btn:hover { background: #2ea043; }
        #status-log { font-size: 11px; color: #39ff14; margin-top: 6px; }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="admin-panel">
        <h3>SPATIAL AUTHORING TOOL</h3>
        
        <label style="font-size: 11px; color: #8b949e;">SELECT HARDWARE NODE:</label>
        <select id="device-select" onchange="changeActiveDevice()">
            <option value="smart_climate_node">SMART CLIMATE NODE</option>
            <option value="perimeter_monitor">PERIMETER MONITOR</option>
            <option value="smart_power_relay">SMART POWER RELAY</option>
        </select>

        <label style="font-size: 11px; color: #8b949e;">ADJUST POSITION (X / Y / Z):</label>
        <div class="step-controls">
            <button class="step-btn" onclick="adjustOffset('x', -0.1)">-X (Left)</button>
            <button class="step-btn" onclick="adjustOffset('y', 0.1)">+Y (Up)</button>
            <button class="step-btn" onclick="adjustOffset('x', 0.1)">+X (Right)</button>
            <button class="step-btn" onclick="adjustOffset('z', -0.1)">-Z (Far)</button>
            <button class="step-btn" onclick="adjustOffset('y', -0.1)">-Y (Down)</button>
            <button class="step-btn" onclick="adjustOffset('z', 0.1)">+Z (Near)</button>
        </div>

        <div id="pos-display" style="font-size: 11px; color: #00f0ff;">POS: X: 0.00 | Y: 0.25 | Z: 0.00</div>

        <button id="save-btn" onclick="saveActiveDevice()">SAVE NODE TO RENDER DB</button>
        <div id="status-log">TARGET UNANCHORED</div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: /assets/targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true; antialias: true; alpha: true;" 
        vr-mode-ui="enabled: false">

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

        <a-entity id="noemata-spatial-anchor" mindar-image-target="targetIndex: 0">

            <!-- 1. SMART CLIMATE NODE -->
            <a-entity id="smart_climate_node-preview" position="0 0.25 0">
                <a-box width="0.18" height="0.18" depth="0.18" material="color: #00f0ff; shader: flat; wireframe: true;"></a-box>
                <a-text value="[ CLIMATE NODE ]" position="0 0.18 0" width="1.2" align="center" color="#00f0ff" font="monoid"></a-text>
            </a-entity>

            <!-- 2. PERIMETER MONITOR -->
            <a-entity id="perimeter_monitor-preview" position="-0.45 0.25 0">
                <a-cylinder radius="0.12" height="0.18" material="color: #00f0ff; shader: flat; wireframe: true;"></a-cylinder>
                <a-text value="[ PERIMETER GUARD ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>
            </a-entity>

            <!-- 3. SMART POWER RELAY -->
            <a-entity id="smart_power_relay-preview" position="0.45 0.25 0">
                <a-box width="0.15" height="0.15" depth="0.15" material="color: #64748b; shader: flat; wireframe: true;"></a-box>
                <a-text value="[ POWER RELAY ]" position="0 0.18 0" width="1.2" align="center" color="#64748b" font="monoid"></a-text>
            </a-entity>

        </a-entity>

    </a-scene>

    <script>
        const socket = io({ transports: ['websocket', 'polling'], secure: true });
        
        let activeDeviceId = "smart_climate_node";
        const positions = {
            smart_climate_node: { x: 0.0, y: 0.25, z: 0.0 },
            perimeter_monitor: { x: -0.45, y: 0.25, z: 0.0 },
            smart_power_relay: { x: 0.45, y: 0.25, z: 0.0 }
        };

        // Load existing saved coordinates from spatial-db.json
        fetch('/api/spatial/map')
            .then(res => res.json())
            .then(db => {
                const map = db.anchors || db;
                Object.keys(positions).forEach(key => {
                    if (map[key] && map[key].x !== undefined) {
                        positions[key] = {
                            x: parseFloat(map[key].x),
                            y: parseFloat(map[key].y),
                            z: parseFloat(map[key].z)
                        };
                        updateEntityMesh(key);
                    }
                });
                updateUI();
            });

        function changeActiveDevice() {
            activeDeviceId = document.getElementById('device-select').value;
            updateUI();
        }

        function adjustOffset(axis, step) {
            positions[activeDeviceId][axis] = parseFloat((positions[activeDeviceId][axis] + step).toFixed(2));
            updateEntityMesh(activeDeviceId);
            updateUI();
        }

        function updateEntityMesh(key) {
            const el = document.getElementById(`${key}-preview`);
            if (el) {
                const pos = positions[key];
                el.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
            }
        }

        function updateUI() {
            const pos = positions[activeDeviceId];
            document.getElementById('pos-display').innerText = 
                `POS: X: ${pos.x.toFixed(2)} | Y: ${pos.y.toFixed(2)} | Z: ${pos.z.toFixed(2)}`;
        }

        function saveActiveDevice() {
            const pos = positions[activeDeviceId];
            document.getElementById('status-log').innerText = "SAVING TO DB...";

            fetch('/api/spatial/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: activeDeviceId, position: pos })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('status-log').innerText = `SAVED ${activeDeviceId.toUpperCase()}!`;
            })
            .catch(err => {
                document.getElementById('status-log').innerText = "ERROR SAVING TO DB";
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const target = document.querySelector('#noemata-spatial-anchor');
            target.addEventListener("targetFound", () => {
                document.getElementById('status-log').innerText = "TARGET ANCHORED";
            });
            target.addEventListener("targetLost", () => {
                document.getElementById('status-log').innerText = "TARGET UNANCHORED";
            });
        });
    </script>
</body>
</html>
